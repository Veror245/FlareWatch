<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlareWatch - Live Events</title>
<link rel="icon" type="image/x-icon" href="./icon/icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #050507;
    color: #e1e1e6;
    overflow: hidden;
  }

  /* Minimal Scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  /* Full Screen Canvas for Interactive Dots */
  #dotCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
  }

  /* App Layout Container */
  .app-container {
    position: relative;
    z-index: 1;
    display: flex;
    width: 100vw;
    height: 100vh;
  }

  /* Animated Collapsible Sidebar */
  .sidebar {
    width: 68px; /* Collapsed width */
    background: rgba(10, 10, 13, 0.85);
    border-right: 1px solid rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px 0;
    flex-shrink: 0;
    overflow: hidden;
    white-space: nowrap;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 10;
  }

  .sidebar:hover {
    width: 240px; /* Expanded width */
    box-shadow: 10px 0 40px rgba(0, 0, 0, 0.6);
  }

  .brand-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px 32px 18px;
    height: 32px;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 1px;
  }

  .brand-logo svg {
    width: 26px;
    height: 30px;
    flex-shrink: 0;
  }

  .brand-logo .red { color: #ff2a2a; }
  .brand-logo .white { color: #ffffff; }

  /* Animated Text Hiding/Showing */
  .brand-text,
  .nav-text,
  .collapse-btn {
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }

  .sidebar:hover .brand-text,
  .sidebar:hover .nav-text,
  .sidebar:hover .collapse-btn {
    opacity: 1;
    visibility: visible;
    transition-delay: 0.08s;
  }

  .collapse-btn {
    background: transparent;
    border: none;
    color: #666;
    cursor: pointer;
    font-size: 14px;
  }
  .collapse-btn:hover { color: #aaa; }

  .nav-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 0 12px;
  }

  .nav-item a {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px;
    color: #888899;
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    border-radius: 8px;
    height: 46px;
    transition: all 0.2s ease;
  }

  .nav-item a:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.04);
  }

  .nav-item.active a {
    color: #fff;
    background: rgba(255, 42, 42, 0.1);
    border: 1px solid rgba(255, 42, 42, 0.25);
    box-shadow: inset 0 0 12px rgba(255, 42, 42, 0.05);
  }

  .nav-item svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    flex-shrink: 0;
  }

  /* Main Content Area */
  .main-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 32px 40px;
    overflow-y: auto;
    gap: 24px;
  }

  /* Page Top Header */
  .page-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-shrink: 0;
    
  }

  .header-titles h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #ffffff;
  }

  .header-titles p {
    font-size: 13px;
    color: #777788;
    margin-top: 6px;
    font-weight: 500;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .action-btn {
    background: rgba(18, 18, 24, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #9999aa;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.2s ease;
  }

  .action-btn:hover {
    color: #fff;
    border-color: rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
  }

  .action-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
  }

  /* Metrics Grid (New Information Section) */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    flex-shrink: 0;
  }

  .metric-card {
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.097);
    backdrop-filter: blur(2px);
    background-color: rgba(255, 255, 255, 0.071);
    border-radius: 30px;
  }

  .metric-title {
    font-size: 11.5px;
    color: #888899;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  .metric-value {
    font-size: 28px;
    color: #fff;
    font-weight: 300;
    letter-spacing: 0.5px;
  }
  
  .metric-value.danger { color: #ff4d4d; }
  .metric-value.safe { color: #00e676; }

  /* Events Main Panel Card */
  .panel-card {
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    flex: 1;
    min-height: 0; /* Important for flex child scrolling */
    border: 1px solid rgba(255, 255, 255, 0.097);
    backdrop-filter: blur(2px);
    background-color: rgba(255, 255, 255, 0.071);
    border-radius: 30px;
  }

  /* Controls Filter Bar */
  .filter-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 20px 24px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  }

  .custom-select {
    background: rgba(18, 18, 24, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #d1d1d6;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    cursor: pointer;
    transition: border 0.2s;
    min-width: 150px;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2214%22%20height%3D%2214%22%20viewBox%3D%220%200%24%2024%22%20fill%3D%22none%22%20stroke%3D%22%23888899%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat;
    background-position: right 12px top 50%;
  }

  .custom-select:hover, .custom-select:focus {
    border-color: rgba(255, 255, 255, 0.2);
  }

  .search-wrapper {
    position: relative;
    flex: 1;
    min-width: 250px;
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    stroke: #666677;
  }

  .search-input {
    width: 100%;
    background: rgba(18, 18, 24, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #fff;
    padding: 10px 16px 10px 40px;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    transition: border 0.2s;
  }

  .search-input:focus {
    border-color: rgba(255, 42, 42, 0.4);
  }

  .btn-clear {
    background: rgba(255, 42, 42, 0.05);
    border: 1px solid rgba(255, 42, 42, 0.3);
    color: #ff4d4d;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-clear:hover {
    background: rgba(255, 42, 42, 0.15);
    border-color: rgba(255, 42, 42, 0.6);
  }

  /* Events Table */
  .table-container {
    flex: 1;
    overflow-x: auto;
    overflow-y: auto;
    scrollbar-width: none;
  }

  .events-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  .events-table th {
    font-size: 11px;
    font-weight: 600;
    color: #777788;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 16px 24px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    background: rgba(255, 255, 255, 0.01);
    position: sticky;
    top: 0;
    z-index: 2;
    backdrop-filter: blur(8px);
  }

  .events-table td {
    padding: 16px 24px;
    font-size: 13.5px;
    color: #d1d1d6;
    border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    white-space: nowrap;
    transition: background 0.15s;
  }

  .events-table tr:hover td {
    background: rgba(255, 255, 255, 0.03);
  }

  .cell-time {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: #aaaabb;
    font-size: 12.5px;
  }

  .cell-details {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: #888899;
    font-size: 12.5px;
  }

  .cell-ip {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: #bbbbcc;
    font-size: 12.5px;
  }

  /* Severity Badges */
  .badge-sev {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .badge-sev.high {
    background: rgba(255, 42, 42, 0.1);
    border: 1px solid rgba(255, 42, 42, 0.3);
    color: #ff4d4d;
    box-shadow: 0 0 10px rgba(255, 42, 42, 0.1);
  }

  .badge-sev.medium {
    background: rgba(255, 179, 0, 0.1);
    border: 1px solid rgba(255, 179, 0, 0.3);
    color: #ffb300;
  }

  .badge-sev.low {
    background: rgba(0, 230, 118, 0.08);
    border: 1px solid rgba(0, 230, 118, 0.25);
    color: #00e676;
  }

  /* Pagination Bar */
  .pagination-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.03);
    background: rgba(0, 0, 0, 0.1);
  }

  .page-btn {
    min-width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.05);
    color: #888899;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .page-btn:hover {
    color: #fff;
    border-color: rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.05);
  }

  .page-btn.active {
    background: rgba(255, 42, 42, 0.8);
    border-color: #ff2a2a;
    color: #ffffff;
    box-shadow: 0 0 12px rgba(255, 42, 42, 0.3);
  }

  .page-dots {
    color: #555566;
    font-size: 14px;
    padding: 0 4px;
  }

  .app-container {
    animation: page-enter 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    transform-origin: center top;
  }

  .app-container.page-leaving {
    animation: page-leave 0.28s cubic-bezier(0.4, 0, 1, 1) both;
    pointer-events: none;
  }

  @keyframes page-enter {
    from { opacity: 0; transform: translateY(12px) scale(0.99); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes page-leave {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to { opacity: 0; transform: translateY(-8px) scale(0.995); }
  }

  @media (prefers-reduced-motion: reduce) {
    .app-container,
    .app-container.page-leaving { animation: none; }
  }
</style>
</head>

<script>
  const pageContainer = document.querySelector('.app-container');

  document.querySelectorAll('a[href]').forEach((link) => {
    link.addEventListener('click', (event) => {
      const destination = new URL(link.href, window.location.href);
      const isPageNavigation = destination.origin === window.location.origin &&
        destination.pathname !== window.location.pathname &&
        destination.protocol !== 'mailto:';

      if (!isPageNavigation || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
        return;
      }

      event.preventDefault();
      pageContainer.classList.add('page-leaving');
      window.setTimeout(() => { window.location.href = destination.href; }, 280);
    });
  });

  // Dataset matching image exactly
  const initialEvents = [
    { time: '10:24:10', severity: 'HIGH', type: 'SQL Injection', details: 'Pattern: union select', ip: '192.168.1.10' },
    { time: '10:24:09', severity: 'HIGH', type: 'Path Traversal', details: 'Pattern: ../', ip: '192.168.1.22' },
    { time: '10:24:08', severity: 'HIGH', type: 'Command Injection', details: 'Pattern: cmd.exe', ip: '192.168.1.55' },
    { time: '10:24:07', severity: 'MEDIUM', type: 'Login Failed', details: 'User: admin', ip: '192.168.1.45' },
    { time: '10:24:06', severity: 'LOW', type: 'Normal Traffic', details: 'GET /index.html', ip: '192.168.1.12' },
    { time: '10:24:05', severity: 'HIGH', type: 'XSS Attempt', details: 'Pattern: <script>', ip: '192.168.1.99' },
    { time: '10:24:04', severity: 'MEDIUM', type: 'Suspicious Scanner', details: 'Nmap Scan Detected', ip: '192.168.1.77' },
    { time: '10:24:03', severity: 'LOW', type: 'Normal Traffic', details: 'POST /login', ip: '192.168.1.33' },
    { time: '10:24:02', severity: 'HIGH', type: 'SQL Injection', details: 'Pattern: \'or 1=1', ip: '192.168.1.10' },
    { time: '10:24:01', severity: 'LOW', type: 'Normal Traffic', details: 'GET /about', ip: '192.168.1.12' }
  ];

  const tableBody = document.getElementById('eventsTableBody');
  const typeFilter = document.getElementById('typeFilter');
  const severityFilter = document.getElementById('severityFilter');
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const eventCounter = document.getElementById('eventCounter');

  // Metrics DOM Elements
  const metricTotal = document.getElementById('metric-total');
  const metricHigh = document.getElementById('metric-high');
  const metricIps = document.getElementById('metric-ips');

  function renderTable() {
    const selectedType = typeFilter.value;
    const selectedSev = severityFilter.value;
    const query = searchInput.value.toLowerCase().trim();

    const filtered = initialEvents.filter(item => {
      const matchType = selectedType === 'ALL' || item.type === selectedType;
      const matchSev = selectedSev === 'ALL' || item.severity === selectedSev;
      const matchSearch = query === '' || 
        item.type.toLowerCase().includes(query) ||
        item.details.toLowerCase().includes(query) ||
        item.ip.toLowerCase().includes(query) ||
        item.time.includes(query);

      return matchType && matchSev && matchSearch;
    });

    eventCounter.textContent = `Displaying ${filtered.length} of ${initialEvents.length} Recent Events`;

    // Update dynamic metric cards
    metricTotal.textContent = filtered.length;
    metricHigh.textContent = filtered.filter(e => e.severity === 'HIGH').length;
    metricIps.textContent = new Set(filtered.map(e => e.ip)).size;

    tableBody.innerHTML = filtered.map(e => `
      <tr>
        <td class="cell-time">${e.time}</td>
        <td><span class="badge-sev ${e.severity.toLowerCase()}">${e.severity}</span></td>
        <td><strong>${e.type}</strong></td>
        <td class="cell-details">${escapeHtml(e.details)}</td>
        <td class="cell-ip">${e.ip}</td>
      </tr>
    `).join('');
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  typeFilter.addEventListener('change', renderTable);
  severityFilter.addEventListener('change', renderTable);
  searchInput.addEventListener('input', renderTable);

  clearBtn.addEventListener('click', () => {
    typeFilter.value = 'ALL';
    severityFilter.value = 'ALL';
    searchInput.value = '';
    renderTable();
  });

  renderTable();

  // Full Screen Dynamic Canvas Engine with Clamped Radius Limiter
  const canvas = document.getElementById('dotCanvas');
  const ctx = canvas.getContext('2d');

  let width, height;
  let dots = [];
  const spacing = 22;             
  const baseRadius = 0.95;        
  const hoverRadius = 140;        
  const MAX_DOT_RADIUS = 4.5;     

  let mouse = { x: -1000, y: -1000, targetX: -1000, targetY: -1000 };

  function initGrid() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    dots = [];
    const cols = Math.ceil(width / spacing) + 1;
    const rows = Math.ceil(height / spacing) + 1;

    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const baseX = i * spacing;
        const baseY = j * spacing;
        
        const isThreat = Math.random() < 0.012;
        const isSuspicious = !isThreat && Math.random() < 0.018;
        const initialR = isThreat ? 2.5 : (isSuspicious ? 2.0 : baseRadius);

        dots.push({
          baseX,
          baseY,
          x: baseX,
          y: baseY,
          baseR: initialR,
          r: initialR,
          colorType: isThreat ? 'threat' : (isSuspicious ? 'suspicious' : 'normal'),
          opacity: isThreat ? 0.85 : (isSuspicious ? 0.75 : 0.28)
        });
      }
    }
  }

  window.addEventListener('resize', initGrid);

  window.addEventListener('mousemove', (e) => {
    mouse.targetX = e.clientX;
    mouse.targetY = e.clientY;
  });

  window.addEventListener('mouseleave', () => {
    mouse.targetX = -1000;
    mouse.targetY = -1000;
  });

  function render(time) {
    ctx.clearRect(0, 0, width, height);

    mouse.x += (mouse.targetX - mouse.x) * 0.1;
    mouse.y += (mouse.targetY - mouse.y) * 0.1;

    const t = time * 0.0025;

    for (let i = 0; i < dots.length; i++) {
      const d = dots[i];

      const waveX = Math.sin(t + d.baseY * 0.015) * 1.1;
      const waveY = Math.cos(t + d.baseX * 0.015) * 1.1;

      const dx = mouse.x - d.baseX;
      const dy = mouse.y - d.baseY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      let targetX = d.baseX + waveX;
      let targetY = d.baseY + waveY;
      let targetR = d.baseR;
      let targetOpacity = d.colorType !== 'normal' ? d.opacity : 0.28;

      if (dist < hoverRadius) {
        const norm = 1 - dist / hoverRadius;
        const factor = norm * norm * (3 - 2 * norm);

        const addedRadius = factor * 2.8;
        targetR = Math.min(d.baseR + addedRadius, MAX_DOT_RADIUS);
        targetOpacity = Math.min(1, targetOpacity + factor * 0.6);

        const angle = Math.atan2(dy, dx);
        const waveDisplacement = Math.sin(time * 0.008 - dist * 0.07) * 3 * factor;
        const pushAmount = factor * 12;

        targetX = d.baseX - Math.cos(angle) * (pushAmount + waveDisplacement) + waveX;
        targetY = d.baseY - Math.sin(angle) * (pushAmount + waveDisplacement) + waveY;
      }

      d.x += (targetX - d.x) * 0.12;
      d.y += (targetY - d.y) * 0.12;
      d.r += (targetR - d.r) * 0.12;
      d.opacity += (targetOpacity - d.opacity) * 0.12;

      let color;
      if (d.colorType === 'threat') {
        color = `rgba(255, 42, 42, ${d.opacity})`;
      } else if (d.colorType === 'suspicious') {
        color = `rgba(255, 179, 0, ${d.opacity})`;
      } else {
        color = `rgba(0, 229, 255, ${d.opacity})`;
      }

      const finalRadius = Math.min(Math.max(0.1, d.r), MAX_DOT_RADIUS);

      ctx.beginPath();
      ctx.arc(d.x, d.y, finalRadius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      if (d.colorType === 'threat' || finalRadius > 3.2) {
        ctx.shadowBlur = finalRadius * 2;
        ctx.shadowColor = color;
      } else {
        ctx.shadowBlur = 0;
      }
    }

    requestAnimationFrame(render);
  }

  initGrid();
  requestAnimationFrame(render);

  //CONNECTION

  const eventStream = new EventSource(
    "http://localhost:4004/events"
  );

  eventStream.onopen = () => {
    console.log(
        "Connected to FlareWatch event stream"
    );
  };

  eventStream.onmessage = (event) => {
    const data = JSON.parse(event.data);
    console.log(
        "Received from tcp_server.js:",
        data
    );

    if (data.type === "connection") {
        console.log("Frontend connected");
        return;
    }

    // Your dashboard update goes here
    console.log("THREAT:", data);
  };

  eventStream.onerror = (error) => {
    console.error(
        "SSE connection error:",
        error
    );
  };
</script>
