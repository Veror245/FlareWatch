<template id="page-overview">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #050507;
    color: #e1e1e6;
    overflow: hidden;
  }

  /* NEW: Intro Overlay Animation Styles */
  #intro-overlay {
    position: fixed;
    inset: 0;
    background: #050507;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }

  .intro-logo {
    display: flex;
    align-items: center;
    gap: 16px;
    font-weight: 800;
    font-size: 36px;
    letter-spacing: 2px;
    margin-bottom: 30px;
    color: #fff;
  }

  .intro-logo svg {
    width: 48px;
    height: 56px;
  }

  .intro-logo .red { color: #ff2a2a; }

  .intro-progress-bar {
    width: 220px;
    height: 2px;
    background: rgba(255, 255, 255, 0.1);
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .intro-progress-fill {
    height: 100%;
    background: #00e676;
    width: 0%;
    box-shadow: 0 0 10px #00e676;
    animation: introLoad 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  .intro-status {
    font-family: monospace;
    font-size: 11px;
    color: #888899;
    letter-spacing: 2px;
    animation: introPulse 1s infinite alternate;
  }

  @keyframes introLoad {
    0% { width: 0%; }
    40% { width: 65%; }
    100% { width: 100%; }
  }

  @keyframes introPulse {
    from { opacity: 0.4; }
    to { opacity: 1; }
  }

  .intro-fade-out {
    opacity: 0;
    visibility: hidden;
  }

  /* Full Screen Canvas for Interactive Dots */
  #dotCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
  }

  /* App Layout Container */
  .app-container {
    position: relative;
    z-index: 1;
    display: flex;
    width: 100vw;
    height: 100vh;
    animation: page-enter 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    transform-origin: center top;
  }

  /* Animated Collapsible Sidebar */
  .sidebar {
    width: 68px; /* Collapsed width */
    background: rgba(10, 10, 13, 0.9);
    border-right: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(14px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 50px 0;
    flex-shrink: 0;
    overflow: hidden;
    white-space: nowrap;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 10;
    border-radius: 0px 30px 30px 0px;
  }

  /* Hover to Expand Sidebar */
  .sidebar:hover {
    width: 230px; /* Expanded width */
    box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
  }

  .brand-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px 24px 18px;
    height: 32px;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 1px;
  }

  .brand-logo svg {
    width: 26px;
    height: 30px;
    flex-shrink: 0;
  }

  .brand-logo .red { color: #ff2a2a; }
  .brand-logo .white { color: #ffffff; }

  /* Animated Text Hiding/Showing */
  .brand-text,
  .nav-text,
  .status-text,
  .collapse-btn {
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }

  .sidebar:hover .brand-text,
  .sidebar:hover .nav-text,
  .sidebar:hover .status-text,
  .sidebar:hover .collapse-btn {
    opacity: 1;
    visibility: visible;
    transition-delay: 0.08s;
  }

  .collapse-btn {
    background: transparent;
    border: none;
    color: #666;
    cursor: pointer;
    font-size: 12px;
  }
  .collapse-btn:hover { color: #aaa; }

  .nav-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 0 12px;
  }

  .nav-item a {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px;
    color: #888899;
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    border-radius: 8px;
    height: 44px;
    transition: all 0.2s ease;
  }

  .nav-item a:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.05);
  }

  .nav-item.active a {
    color: #fff;
    background: rgba(255, 42, 42, 0.12);
    border: 1px solid rgba(255, 42, 42, 0.35);
    box-shadow: 0 0 10px rgba(255, 42, 42, 0.18);
  }

  .nav-item svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    flex-shrink: 0;
  }

  .sidebar-footer {
    padding: 0 12px;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: rgba(0, 230, 118, 0.06);
    border: 1px solid rgba(0, 230, 118, 0.2);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    color: #00e676;
    letter-spacing: 0.5px;
    height: 40px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00e676;
    box-shadow: 0 0 8px #00e676;
    flex-shrink: 0;
  }

  /* Main Viewport */
  .main-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top Bar */
  .topbar {
    height: 60px;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 28px;
    width: 100%;
  }

  .header-container {
    display: flex;
    height: 60px;
    border: 1px solid rgba(255, 255, 255, 0.097);
    backdrop-filter: blur(2px);
    background-color: rgba(255, 255, 255, 0.071);
    border-radius: 30px;
    align-items: center;
    justify-content: center;
    width: 30%;
  }

  .topbar-info {
    display: flex;
    align-items: center;
    gap: 36px;
  }

  .info-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .info-label {
    font-size: 10px;
    color: #666677;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .info-value {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .info-value.online {
    color: #00e676;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Content Dashboard Area */
  .content-area {
    flex: 1;
    padding: 22px 28px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Top Metric Cards Grid */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }

  .metric-card {
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 120px;
    border: 1px solid rgba(255, 255, 255, 0.097);
    backdrop-filter: blur(2px);
    background-color: rgba(255, 255, 255, 0.071);
    border-radius: 30px;
    animation: tileFadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }

  /* Stagger the entrance of each metric card */
  .metric-card:nth-child(1) { animation-delay: 0.1s; }
  .metric-card:nth-child(2) { animation-delay: 0.2s; }
  .metric-card:nth-child(3) { animation-delay: 0.3s; }
  .metric-card:nth-child(4) { animation-delay: 0.4s; }

  .metric-header {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    color: #888899;
    text-transform: uppercase;
  }

  .metric-card.red .metric-header { color: #ff3b3b; }
  .metric-card.purple .metric-header { color: #b388ff; }

  .metric-body {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .metric-value {
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
  }

  .metric-value.red { color: #ff3b3b; }

  .metric-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sparkline {
    width: 100px;
    height: 22px;
  }

  .trend {
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .trend.up-green { color: #00e676; }
  .trend.up-red { color: #ff3b3b; }
  .trend.up-cyan { color: #00e5ff; }
  .trend.up-purple { color: #b388ff; }

  /* Main Lower Grid Layout */
  .dashboard-bottom {
    display: flex;
    flex: 1;
    min-height: 450px;
    position: relative;
  }

  .panel-card {
    width: 100%;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    animation: tileFadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    animation-delay: 0.5s;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    background: rgba(14, 14, 18, 0.6);
    backdrop-filter: blur(8px);
    z-index: 10;
  }

  .panel-title {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.9px;
    text-transform: uppercase;
    color: #eee;
  }

  /* Live Visualizer Stage */
  .flow-visualizer-body {
    flex: 1;
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  #trafficCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* Central Server Element */
  .server-node {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(14, 16, 22, 0.85); /* Minimalist dark glass */
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.06); 
    border-top: 1px solid rgba(0, 229, 255, 0.4); /* Subtle cyber-accent */
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
    border-radius: 20px;
    padding: 14px 35px;
    z-index: 5;
    pointer-events: none;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    animation: serverFloat 4s ease-in-out infinite;
    width: 200px;
  height: 80px;
  }

  /* Ambient Data Scanning Line */
  .server-node::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.12), transparent);
    transform: skewX(-20deg);
    animation: serverScan 3s ease-in-out infinite;
  }

  /* Pulsing Status Dot */
  .server-node::after {
    content: '';
    width: 6px;
    height: 6px;
    background: #00e676;
    border-radius: 50%;
    box-shadow: 0 0 8px #00e676;
    animation: statusPulse 2s infinite ease-in-out;
  }

  .server-title {
    font-weight: 700;
    letter-spacing: 4px;
    font-size: 16px;
    color: #e1e1e6;
    text-transform: uppercase;
    z-index: 2;
  }

  /* --- Server Box Animations --- */
  @keyframes serverFloat {
    0%, 100% { transform: translate(-50%, -50%); }
    50% { transform: translate(-50%, calc(-50% - 6px)); }
  }

  @keyframes serverScan {
    0% { left: -100%; }
    100% { left: 200%; }
  }

  @keyframes statusPulse {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* Unified Grid Matrix */
  .threat-cards-overlay {
    position: absolute;
    inset: 0;
    padding: 18px 20px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(5, 75px);
    align-content: space-between;
    gap: 12px;
    pointer-events: none;
    z-index: 6;
  }

  .floating-card {
    position: relative !important;
    left: auto !important;
    top: auto !important;
    width: 100% !important;
    height: 100% !important;
    border-left: 4px solid #ff3b3b;
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    pointer-events: auto;
    backdrop-filter: blur(2px);
    background-color: rgba(255, 255, 255, 0.071);
    overflow: hidden;
    animation: cardEnter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  .floating-card.leaving {
    animation: cardLeave 0.3s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards !important;
  }

  .floating-card:hover {
    transform: translateY(-2px) !important;
    animation-play-state: paused !important;
  }

  .floating-card.yellow { border-left-color: #ffb300; }
  .floating-card.green { border-left-color: #00e676; }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
    gap: 10px;
    min-width: 0;
  }

  .card-ip {
    font-family: monospace;
    font-size: 10px;
    color: #888899;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-priority {
    font-size: 9px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .card-priority.red { background: rgba(255, 59, 59, 0.2); color: #ff3b3b; }
  .card-priority.yellow { background: rgba(255, 179, 0, 0.2); color: #ffb300; }
  .card-priority.green { background: rgba(0, 230, 118, 0.2); color: #00e676; }

  .card-threat {
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-req {
    font-family: monospace;
    font-size: 10px;
    color: #aaa;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  @keyframes cardEnter {
    0% { opacity: 0; transform: translateY(20px) scale(0.9); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes cardLeave {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.85); }
  }

  @keyframes smoothRandomWiggle {
    0% { transform: translate(0, 0) rotate(0deg); }
    33% { transform: translate(2px, -3px) rotate(0.8deg); }
    66% { transform: translate(-2px, 3px) rotate(-0.5deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  .random-box {
    animation: smoothRandomWiggle 4s ease-in-out infinite alternate;
  }
  
  @keyframes tileFadeInUp {
    0% {
      opacity: 0;
      transform: translateY(24px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes page-enter {
    0% { 
      opacity: 0;
      transform: scale(0.98);
    }
    100% { 
      opacity: 1; 
      transform: scale(1);
    }
  }

  @media (max-width: 1024px) {
    .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    .threat-cards-overlay {
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(6, 75px);
    }
  }

</style>

      </div>
      </div>

    <!-- Main Dashboard Content -->
    <main class="content-area">

      <!-- 4 Top Metric Cards -->
      <div class="metrics-grid">

        <!-- Logs / Sec -->

          <div class="metric-header">LOGS / SEC</div>

        <!-- Threats Detected -->

          <div class="metric-footer">
            <svg class="sparkline" viewBox="0 0 100 25">
              <path id="spark-2" fill="none" stroke="#ff3b3b" stroke-width="2"/>
            </svg>
            <div class="trend up-red">&uarr;</div>

        </div>

        <!-- Total Logs -->
        <div class="metric-card">
          <div class="metric-header">TOTAL LOGS</div>
          <div class="metric-body">
            <div class="metric-value" id="metric-total-logs">0</div>
          </div>
          <div class="metric-footer">
            <svg class="sparkline" viewBox="0 0 100 25">
              <path id="spark-3" fill="none" stroke="#00e5ff" stroke-width="2"/>

        <!-- Bytes Processed -->
        <div class="metric-card purple">
          <div class="metric-header">BYTES PROCESSED</div>

          <div class="metric-footer">
            <svg class="sparkline" viewBox="0 0 100 25">
              <path id="spark-4" fill="none" stroke="#b388ff" stroke-width="2"/>
            </svg>
            <div class="trend up-purple">&uarr;</div>

      </div>

      <!-- Main Lower Full Width Section -->
      <div class="dashboard-bottom">
        <div class="panel-card">
          <div class="panel-header">
            <span class="panel-title">LIVE SERVER TRAFFIC & THREAT FILTERING</span>
            <span style="color:#555; cursor:pointer;">&times;</span>
          </div>

          <div class="flow-visualizer-body">
            <!-- Canvas for Traffic Animations -->
            <canvas id="trafficCanvas"></canvas>

            <!-- Center Server Box -->
            <div class="server-node">
              <div class="server-title">SERVER</div>

    </main>

  </div>

</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const introOverlay = document.getElementById("intro-overlay");
    if (introOverlay) {
      if (!sessionStorage.getItem("flarewatch_intro_played")) {
        // Play the intro for 2.4 seconds, then fade out
        setTimeout(() => {
          introOverlay.classList.add("intro-fade-out");
          sessionStorage.setItem("flarewatch_intro_played", "true");
          setTimeout(() => introOverlay.remove(), 600); // Wait for CSS transition to end
        }, 2400); 
      } else {
        // Intro has already been played in this session, skip entirely
        introOverlay.style.display = "none";
        introOverlay.remove();
      }
    }
  });

  // Dynamic dashboard uptime (persists across reloads, resets when the page/browser session ends)
  const uptimeValue = document.getElementById("uptime-value");
  const uptimeStorageKey = "flarewatch_uptime_start";
  let uptimeStart = Number(sessionStorage.getItem(uptimeStorageKey));

  if (!Number.isFinite(uptimeStart) || uptimeStart <= 0) {
      uptimeStart = Date.now();
      sessionStorage.setItem(uptimeStorageKey, String(uptimeStart));
  }

  function updateUptime() {
      if (!uptimeValue) return;

      const elapsedSeconds = Math.max(0, Math.floor((Date.now() - uptimeStart) / 1000));
      const hours = Math.floor(elapsedSeconds / 3600);
      const minutes = Math.floor((elapsedSeconds % 3600) / 60);
      const seconds = elapsedSeconds % 60;

      uptimeValue.textContent =
          `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
  }

  updateUptime();
  setInterval(updateUptime, 1000);

  const pageContainer = document.querySelector('.app-container');

  document.querySelectorAll('a[href]').forEach((link) => {
    link.addEventListener('click', (event) => {
      const destination = new URL(link.href, window.location.href);
      const isPageNavigation = destination.origin === window.location.origin &&
        destination.pathname !== window.location.pathname &&
        destination.protocol !== 'mailto:';

      if (!isPageNavigation || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
        return;
      }

      event.preventDefault();
      pageContainer.classList.add('page-leaving');
      window.setTimeout(() => { window.location.href = destination.href; }, 280);
    });
  });

  // Full Screen Interactive Canvas Grid Engine
  const canvas = document.getElementById('dotCanvas');
  const ctx = canvas.getContext('2d');

  let width, height;
  let dots = [];
  const spacing = 22;              
  const baseRadius = 0.7;        
  const hoverRadius = 140;        
  const MAX_DOT_RADIUS = 4.5;      

  let mouse = { x: -1000, y: -1000, targetX: -1000, targetY: -1000 };

  function initGrid() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    dots = [];
    const cols = Math.ceil(width / spacing) + 1;
    const rows = Math.ceil(height / spacing) + 1;

    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const baseX = i * spacing;
        const baseY = j * spacing;
        
        const isThreat = Math.random() < 0.012;
        const isSuspicious = !isThreat && Math.random() < 0.018;

        const initialR = isThreat ? 2.5 : (isSuspicious ? 2.0 : baseRadius);

        dots.push({
          baseX,
          baseY,
          x: baseX,
          y: baseY,
          baseR: initialR,
          r: initialR,
          colorType: isThreat ? 'threat' : (isSuspicious ? 'suspicious' : 'normal'),
          opacity: isThreat ? 0.85 : (isSuspicious ? 0.75 : 0.28)
        });
      }
    }
  }

  window.addEventListener('mousemove', (e) => {
    mouse.targetX = e.clientX;
    mouse.targetY = e.clientY;
  });

  window.addEventListener('mouseleave', () => {
    mouse.targetX = -1000;
    mouse.targetY = -1000;
  });

  const sparkPath1 = document.getElementById('spark-1');
  const sparkPath2 = document.getElementById('spark-2');
  const sparkPath3 = document.getElementById('spark-3');
  const sparkPath4 = document.getElementById('spark-4');
  
  let targetLogAmp = 1.5, currentLogAmp = 1.5;
  let targetThreatAmp = 1.5, currentThreatAmp = 1.5;
  let targetTotalAmp = 1.5, currentTotalAmp = 1.5;
  let targetBytesAmp = 1.5, currentBytesAmp = 1.5;

  function updateSparklines(time) {
    const t = time * 0.003;
    
    targetLogAmp += (1.5 - targetLogAmp) * 0.01;
    targetThreatAmp += (1.5 - targetThreatAmp) * 0.01;
    targetTotalAmp += (1.5 - targetTotalAmp) * 0.01;
    targetBytesAmp += (1.5 - targetBytesAmp) * 0.01;

    currentLogAmp += (targetLogAmp - currentLogAmp) * 0.04;
    currentThreatAmp += (targetThreatAmp - currentThreatAmp) * 0.04;
    currentTotalAmp += (targetTotalAmp - currentTotalAmp) * 0.04;
    currentBytesAmp += (targetBytesAmp - currentBytesAmp) * 0.04;

    function getWavePath(freq, amp, phase) {
      let d = "";
      const steps = 20;
      for (let i = 0; i <= steps; i++) {
        const x = (i / steps) * 100;
        const y = 12.5 + Math.sin((i * freq) + t + phase) * amp + Math.cos((i * freq * 0.5) - t * 0.7) * (amp * 0.4);
        if (i === 0) d += `M${x},${y}`;
        else d += ` L${x},${y}`;
      }
      return d;
    }

    if (sparkPath1) sparkPath1.setAttribute('d', getWavePath(0.45, currentLogAmp, 0));
    if (sparkPath2) sparkPath2.setAttribute('d', getWavePath(0.35, currentThreatAmp, 1.5));
    if (sparkPath3) sparkPath3.setAttribute('d', getWavePath(0.5, currentTotalAmp, 3.0));
    if (sparkPath4) sparkPath4.setAttribute('d', getWavePath(0.4, currentBytesAmp, 4.5));
  }

  function render(time) {
    ctx.clearRect(0, 0, width, height);
    mouse.x += (mouse.targetX - mouse.x) * 0.1;
    mouse.y += (mouse.targetY - mouse.y) * 0.1;
    const t = time * 0.0025;

    updateSparklines(time);

    for (let i = 0; i < dots.length; i++) {
      const d = dots[i];
      const waveX = Math.sin(t + d.baseY * 0.015) * 1.1;
      const waveY = Math.cos(t + d.baseX * 0.015) * 1.1;
      const dx = mouse.x - d.baseX;
      const dy = mouse.y - d.baseY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      let targetX = d.baseX + waveX;
      let targetY = d.baseY + waveY;
      let targetR = d.baseR;
      let targetOpacity = d.colorType !== 'normal' ? d.opacity : 0.28;

      if (dist < hoverRadius) {
        const norm = 1 - dist / hoverRadius;
        const factor = norm * norm * (3 - 2 * norm);
        const addedRadius = factor * 2.8;
        targetR = Math.min(d.baseR + addedRadius, MAX_DOT_RADIUS);
        targetOpacity = Math.min(1, targetOpacity + factor * 0.6);
        const angle = Math.atan2(dy, dx);
        const waveDisplacement = Math.sin(time * 0.008 - dist * 0.07) * 3 * factor;
        const pushAmount = factor * 12;
        targetX = d.baseX - Math.cos(angle) * (pushAmount + waveDisplacement) + waveX;
        targetY = d.baseY - Math.sin(angle) * (pushAmount + waveDisplacement) + waveY;
      }

      d.x += (targetX - d.x) * 0.12;
      d.y += (targetY - d.y) * 0.12;
      d.r += (targetR - d.r) * 0.12;
      d.opacity += (targetOpacity - d.opacity) * 0.12;

      let color;
      if (d.colorType === 'threat') color = `rgba(255, 42, 42, ${d.opacity})`;
      else if (d.colorType === 'suspicious') color = `rgba(255, 179, 0, ${d.opacity})`;
      else color = `rgba(0, 229, 255, ${d.opacity})`;

      const finalRadius = Math.min(Math.max(0.1, d.r), MAX_DOT_RADIUS);

      ctx.beginPath();
      ctx.arc(d.x, d.y, finalRadius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      if (d.colorType === 'threat' || finalRadius > 3.2) {
        ctx.shadowBlur = finalRadius * 2;
        ctx.shadowColor = color;
      } else {
        ctx.shadowBlur = 0;
      }
    }
    requestAnimationFrame(render);
  }

  initGrid();
  requestAnimationFrame(render);

  /* Traffic Flow Animation Engine (Server Center Stream) */
  const tfCanvas = document.getElementById('trafficCanvas');
  const tfCtx = tfCanvas.getContext('2d');
  let tfWidth, tfHeight;
  let particles = [];
  let streams = [];
  const numStreams = 16;

  function resizeTrafficCanvas() {
    tfWidth = tfCanvas.width = tfCanvas.parentElement.clientWidth;
    tfHeight = tfCanvas.height = tfCanvas.parentElement.clientHeight;
    initStreams();
  }

  function initStreams() {
    streams = [];
    const centerX = tfWidth / 2;
    const centerY = tfHeight / 2;

    for (let i = 0; i < numStreams; i++) {
      const offsetX = (i - (numStreams - 1) / 2) * 22;
      const randVal = Math.random();
      let color = '#00e676';
      if (randVal < 0.45) color = '#ff3b3b'; 
      else if (randVal < 0.75) color = '#ffb300'; 
      streams.push({ id: i, bottomX: centerX + offsetX * 1.6, topX: centerX + offsetX * 1.4, color: color });
    }
  }

  function triggerTrafficParticle(isThreat, label) {
    const stream = streams[Math.floor(Math.random() * streams.length)];
    const isIncoming = isThreat; 
    
    let pColor;
    if (isThreat) {
      const isCritical = label.toUpperCase().includes("SQL") || 
                         label.toUpperCase().includes("COMMAND") || 
                         label.toUpperCase().includes("INJECTION");
      pColor = isCritical ? '#ff3b3b' : '#ffb300';
    } else {
      pColor = '#00e676';
    }

    particles.push({
      stream: stream,
      isIncoming: isIncoming,
      progress: 0,
      speed: 0.005 + Math.random() * 0.008,
      size: 2.5 + Math.random() * 2,
      color: pColor,
      name: label || (isThreat ? "Threat" : "Clean")
    });
  }

  function animateTraffic() {
    tfCtx.clearRect(0, 0, tfWidth, tfHeight);
    const centerX = tfWidth / 2;
    const centerY = tfHeight / 2;
    const serverTopY = centerY - 35;
    const serverBottomY = centerY + 35;

    streams.forEach((s) => {
      tfCtx.beginPath();
      tfCtx.moveTo(s.bottomX, tfHeight);
      tfCtx.bezierCurveTo(s.bottomX, tfHeight - 50, centerX + (s.bottomX - centerX) * 0.5, serverBottomY + 30, centerX, serverBottomY);
      tfCtx.strokeStyle = s.color === '#ff3b3b' ? 'rgba(255, 59, 59, 0.12)' : (s.color === '#ffb300' ? 'rgba(255, 179, 0, 0.12)' : 'rgba(0, 230, 118, 0.12)');
      tfCtx.lineWidth = 2;
      tfCtx.stroke();

      tfCtx.beginPath();
      tfCtx.moveTo(centerX, serverTopY);
      tfCtx.bezierCurveTo(centerX, serverTopY - 30, s.topX, 50, s.topX, 0);
      tfCtx.strokeStyle = 'rgba(0, 230, 118, 0.25)';
      tfCtx.lineWidth = 2;
      tfCtx.stroke();
    });

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.progress += p.speed;
      if (p.progress >= 1) { particles.splice(i, 1); continue; }
      let currX, currY;
      if (p.isIncoming) {
        const startX = p.stream.bottomX;
        const startY = tfHeight;
        const endX = centerX;
        const endY = serverBottomY;
        const t = p.progress;
        currX = (1 - t) * (1 - t) * startX + 2 * (1 - t) * t * (centerX + (startX - centerX) * 0.5) + t * t * endX;
        currY = (1 - t) * (1 - t) * startY + 2 * (1 - t) * t * (serverBottomY + 30) + t * t * endY;
      } else {
        const startX = centerX;
        const startY = serverTopY;
        const endX = p.stream.topX;
        const endY = 0;
        const t = p.progress;
        currX = (1 - t) * (1 - t) * startX + 2 * (1 - t) * t * (centerX) + t * t * endX;
        currY = (1 - t) * (1 - t) * startY + 2 * (1 - t) * t * (serverTopY - 30) + t * t * endY;
      }
      tfCtx.beginPath();
      tfCtx.arc(currX, currY, p.size, 0, Math.PI * 2);
      tfCtx.fillStyle = p.color;
      tfCtx.shadowBlur = 10;
      tfCtx.shadowColor = p.color;
      tfCtx.fill();
      tfCtx.shadowBlur = 0;

      if (Math.abs(currY - centerY) > 42) {
        tfCtx.font = "bold 9px -apple-system, sans-serif";
        tfCtx.fillStyle = "rgba(255, 255, 255, 0.75)";
        tfCtx.fillText(p.name, currX + 12, currY + 3);
        tfCtx.beginPath();
        tfCtx.moveTo(currX + p.size + 2, currY);
        tfCtx.lineTo(currX + 10, currY);
        tfCtx.strokeStyle = p.color;
        tfCtx.lineWidth = 1;
        tfCtx.stroke();
      }
    }
    requestAnimationFrame(animateTraffic);
  }

  setTimeout(() => {
    resizeTrafficCanvas();
    animateTraffic();
  }, 100);

  window.addEventListener('resize', () => {
      initGrid();
      resizeTrafficCanvas();
      document.querySelectorAll('.floating-card').forEach(el => {
          el.style.display = 'none';
          el.remove();
      });
      if (typeof occupiedCells !== 'undefined') occupiedCells.clear();
  });


  const threatGrid = document.getElementById('threat-grid');
  const occupiedCells = new Set();

  // Persist dashboard metrics across reloads; reset when the browser session ends.
  const metricStorageKeys = {
      logsSec: 'flarewatch_metric_logs_sec',
      threats: 'flarewatch_metric_threats',
      totalLogs: 'flarewatch_metric_total_logs',
      bytes: 'flarewatch_metric_bytes'
  };

  const storedMetric = (key, fallback = 0) => {
      const value = Number(sessionStorage.getItem(key));
      return Number.isFinite(value) && value >= 0 ? value : fallback;
  };

  let localTotalLogs = storedMetric(metricStorageKeys.totalLogs);
  let localThreats = storedMetric(metricStorageKeys.threats);
  let localBytes = storedMetric(metricStorageKeys.bytes);
  let localLogsPerSecond = storedMetric(metricStorageKeys.logsSec);
  let localEventTimes = [];
  let receivedStats = false;

  // Restore the persisted values immediately on page load.
  document.getElementById("metric-logs-sec").innerText = localLogsPerSecond.toLocaleString();
  document.getElementById("metric-threats").innerText = localThreats.toLocaleString();
  document.getElementById("metric-total-logs").innerText = localTotalLogs.toLocaleString();
  document.getElementById("metric-bytes").innerText =
      `${(localBytes / (1024 * 1024)).toFixed(2)} MB`;

  function handleBackendEvent(data, rawMessage = '') {
      if (!data || typeof data !== 'object') return;

      const now = Date.now();
      localEventTimes.push(now);
      localEventTimes = localEventTimes.filter(t => now - t <= 5000);

      // React to payload byte changes
      if (rawMessage) {
          localBytes += new TextEncoder().encode(rawMessage).length;
          sessionStorage.setItem(metricStorageKeys.bytes, String(localBytes));
          targetBytesAmp = Math.min(10, targetBytesAmp + 1.0); 
      }

      if (data.type === "connection") return;

      if (data.type === "stats") {
          receivedStats = true;

          if (data.logs_per_second !== undefined) {
              localLogsPerSecond = Number(data.logs_per_second) || 0;
              sessionStorage.setItem(metricStorageKeys.logsSec, String(localLogsPerSecond));
              document.getElementById("metric-logs-sec").innerText =
                  localLogsPerSecond.toLocaleString();
          }
          if (data.threats_detected !== undefined) {
              localThreats = Number(data.threats_detected) || 0;
              sessionStorage.setItem(metricStorageKeys.threats, String(localThreats));
              document.getElementById("metric-threats").innerText =
                  localThreats.toLocaleString();
          }
          if (data.logs_processed !== undefined) {
              localTotalLogs = Number(data.logs_processed) || 0;
              sessionStorage.setItem(metricStorageKeys.totalLogs, String(localTotalLogs));
              document.getElementById("metric-total-logs").innerText =
                  localTotalLogs.toLocaleString();
          }
          if (data.bytes_processed !== undefined) {
              localBytes = Number(data.bytes_processed) || 0;
              sessionStorage.setItem(metricStorageKeys.bytes, String(localBytes));
              document.getElementById("metric-bytes").innerText =
                  `${(localBytes / (1024 * 1024)).toFixed(2)} MB`;
          }
          return;
      }

      if (data.type === "log" || data.type === "threat" || data.type === "nothreat") {
          localTotalLogs += 1;
          sessionStorage.setItem(metricStorageKeys.totalLogs, String(localTotalLogs));
          
          targetLogAmp = Math.min(10, targetLogAmp + 0.5);
          targetTotalAmp = Math.min(10, targetTotalAmp + 0.5);

          if (data.type === "threat") {
              localThreats += 1;
              sessionStorage.setItem(metricStorageKeys.threats, String(localThreats));
              targetThreatAmp = Math.min(12, targetThreatAmp + 4.0); 
          }

          if (!receivedStats) {
              document.getElementById("metric-total-logs").innerText =
                  localTotalLogs.toLocaleString();
              document.getElementById("metric-threats").innerText =
                  localThreats.toLocaleString();
              localLogsPerSecond = Math.round(localEventTimes.length / 5);
              sessionStorage.setItem(metricStorageKeys.logsSec, String(localLogsPerSecond));
              document.getElementById("metric-logs-sec").innerText =
                  localLogsPerSecond.toLocaleString();
              sessionStorage.setItem(metricStorageKeys.bytes, String(localBytes));
              document.getElementById("metric-bytes").innerText =
                  `${(localBytes / (1024 * 1024)).toFixed(2)} MB`;
          }

          if (data.type === "threat") {
              const threatTitle = data.threat_name || data.threat || "Unknown Threat";
              triggerTrafficParticle(true, threatTitle);
              spawnLiveThreatCard(data);
          } else {
              triggerTrafficParticle(false, "Clean"); 
          }
      }
  }

  function escapeHtml(value) {
      return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
  }
  
  function removeCard(el) {
      if (el.classList.contains('leaving')) return;
      el.classList.add('leaving');
      el.classList.remove('random-box'); 
      
      if (el.dataset.cell) {
          occupiedCells.delete(el.dataset.cell);
      }
      
      setTimeout(() => {
          if (el.parentNode) el.parentNode.removeChild(el);
      }, 300);
  }

  function spawnLiveThreatCard(data) {
      const el = document.createElement('div');

      const threatName = data.threat_name || data.threat || "Unknown Threat";
      const ip = data.ip || "Unknown IP";
      const req = data.request || "-";

      const isCritical = threatName.toUpperCase().includes("SQL") ||
                         threatName.toUpperCase().includes("COMMAND") ||
                         threatName.toUpperCase().includes("INJECTION");
      const color = isCritical ? 'red' : 'yellow';
      const prio = isCritical ? 'CRITICAL' : 'SUSPICIOUS';

      el.className = `floating-card ${color}`;
      el.innerHTML = `
        <div class="card-top">
          <span class="card-ip">${escapeHtml(ip)}</span>
          <span class="card-priority ${color}">${escapeHtml(prio)}</span>
        </div>
        <div class="card-threat">${escapeHtml(threatName)}</div>
        <div class="card-req">${escapeHtml(req)}</div>
      `;

      const isMobile = window.innerWidth <= 1024;
      let r, c, cellKey;
      let attempts = 0;
      let found = false;

      while (attempts < 50) {
          attempts++;
          if (isMobile) {
              c = Math.floor(Math.random() * 4) + 1;
              r = Math.floor(Math.random() * 6) + 1;
              if ((c === 2 || c === 3) && (r === 3 || r === 4)) continue;
          } else {
              c = Math.floor(Math.random() * 6) + 1;
              r = Math.floor(Math.random() * 5) + 1;
              if ((c === 3 || c === 4) && r === 3) continue;
          }
          
          cellKey = `${c}-${r}`;
          if (!occupiedCells.has(cellKey)) {
              found = true;
              break;
          }
      }

      if (!found) {
           const activeCards = threatGrid.querySelectorAll('.floating-card:not(.leaving)');
           if(activeCards.length > 0) {
               removeCard(activeCards[0]); 
           }
           return; 
      }

      occupiedCells.add(cellKey);
      el.style.gridColumn = c;
      el.style.gridRow = r;
      el.dataset.cell = cellKey;

      threatGrid.appendChild(el);

      setTimeout(() => {
          if (el.parentNode && !el.classList.contains('leaving')) {
             el.classList.add('random-box');
          }
      }, 400); 

      const maxCards = isMobile ? 18 : 26; 
      const activeCards = threatGrid.querySelectorAll('.floating-card:not(.leaving)');
      if (activeCards.length >= maxCards) {
          const excess = activeCards.length - maxCards + 1;
          for(let i=0; i<excess; i++) {
              if(activeCards[i]) removeCard(activeCards[i]);
          }
      }

      setTimeout(() => {
          if (el.parentNode) {
             removeCard(el);
          }
      }, 7000);
  }

  setInterval(() => {
      if (receivedStats) return;
      const now = Date.now();
      localEventTimes = localEventTimes.filter(t => now - t <= 5000);
      localLogsPerSecond = Math.round(localEventTimes.length / 5);
      sessionStorage.setItem(metricStorageKeys.logsSec, String(localLogsPerSecond));
      document.getElementById("metric-logs-sec").innerText =
          localLogsPerSecond.toLocaleString();
  }, 1000);

  const backendWs = new WebSocket('ws://localhost:4005');

  backendWs.onopen = () => {
      console.log('[Frontend] Connected to rustTCP_handler.py WebSocket (4005)');
      const indicator = document.getElementById('status-indicator');
      if (indicator) {
          indicator.innerHTML = '<span class="status-dot"></span> ONLINE';
      }
  };

  backendWs.onmessage = (event) => {
      try {
          const data = JSON.parse(event.data);
          handleBackendEvent(data, event.data);
      } catch (err) {
          console.error('[Frontend] WebSocket JSON parse error:', err);
      }
  };

  backendWs.onerror = (err) => {
      console.error('[Frontend] rustTCP_handler.py WebSocket error:', err);
  };

  backendWs.onclose = () => {
      console.warn('[Frontend] rustTCP_handler.py WebSocket disconnected.');
      const indicator = document.getElementById('status-indicator');
      if (indicator) {
          indicator.innerHTML =
              '<span class="status-dot" style="background:#ff3b3b;box-shadow:0 0 8px #ff3b3b;"></span> OFFLINE';
      }
  };

</script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const introOverlay = document.getElementById("intro-overlay");
    if (introOverlay) {
      if (!sessionStorage.getItem("flarewatch_intro_played")) {
        // Play the intro for 2.4 seconds, then fade out
        setTimeout(() => {
          introOverlay.classList.add("intro-fade-out");
          sessionStorage.setItem("flarewatch_intro_played", "true");
          setTimeout(() => introOverlay.remove(), 600); // Wait for CSS transition to end
        }, 2400); 
      } else {
        // Intro has already been played in this session, skip entirely
        introOverlay.style.display = "none";
        introOverlay.remove();
      }
    }
  });

  // Dynamic dashboard uptime (persists across reloads, resets when the page/browser session ends)
  const uptimeValue = document.getElementById("uptime-value");
  const uptimeStorageKey = "flarewatch_uptime_start";
  let uptimeStart = Number(sessionStorage.getItem(uptimeStorageKey));

  if (!Number.isFinite(uptimeStart) || uptimeStart <= 0) {
      uptimeStart = Date.now();
      sessionStorage.setItem(uptimeStorageKey, String(uptimeStart));
  }

  function updateUptime() {
      if (!uptimeValue) return;

      const elapsedSeconds = Math.max(0, Math.floor((Date.now() - uptimeStart) / 1000));
      const hours = Math.floor(elapsedSeconds / 3600);
      const minutes = Math.floor((elapsedSeconds % 3600) / 60);
      const seconds = elapsedSeconds % 60;

      uptimeValue.textContent =
          `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
  }

  updateUptime();
  setInterval(updateUptime, 1000);

  const pageContainer = document.querySelector('.app-container');

  document.querySelectorAll('a[href]').forEach((link) => {
    link.addEventListener('click', (event) => {
      const destination = new URL(link.href, window.location.href);
      const isPageNavigation = destination.origin === window.location.origin &&
        destination.pathname !== window.location.pathname &&
        destination.protocol !== 'mailto:';

      if (!isPageNavigation || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
        return;
      }

      event.preventDefault();
      pageContainer.classList.add('page-leaving');
      window.setTimeout(() => { window.location.href = destination.href; }, 280);
    });
  });

  // Full Screen Interactive Canvas Grid Engine
  const canvas = document.getElementById('dotCanvas');
  const ctx = canvas.getContext('2d');

  let width, height;
  let dots = [];
  const spacing = 22;              
  const baseRadius = 0.7;        
  const hoverRadius = 140;        
  const MAX_DOT_RADIUS = 4.5;      

  let mouse = { x: -1000, y: -1000, targetX: -1000, targetY: -1000 };

  function initGrid() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    dots = [];
    const cols = Math.ceil(width / spacing) + 1;
    const rows = Math.ceil(height / spacing) + 1;

    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const baseX = i * spacing;
        const baseY = j * spacing;
        
        const isThreat = Math.random() < 0.012;
        const isSuspicious = !isThreat && Math.random() < 0.018;

        const initialR = isThreat ? 2.5 : (isSuspicious ? 2.0 : baseRadius);

        dots.push({
          baseX,
          baseY,
          x: baseX,
          y: baseY,
          baseR: initialR,
          r: initialR,
          colorType: isThreat ? 'threat' : (isSuspicious ? 'suspicious' : 'normal'),
          opacity: isThreat ? 0.85 : (isSuspicious ? 0.75 : 0.28)
        });
      }
    }
  }

  window.addEventListener('mousemove', (e) => {
    mouse.targetX = e.clientX;
    mouse.targetY = e.clientY;
  });

  window.addEventListener('mouseleave', () => {
    mouse.targetX = -1000;
    mouse.targetY = -1000;
  });

  const sparkPath1 = document.getElementById('spark-1');
  const sparkPath2 = document.getElementById('spark-2');
  const sparkPath3 = document.getElementById('spark-3');
  const sparkPath4 = document.getElementById('spark-4');
  
  let targetLogAmp = 1.5, currentLogAmp = 1.5;
  let targetThreatAmp = 1.5, currentThreatAmp = 1.5;
  let targetTotalAmp = 1.5, currentTotalAmp = 1.5;
  let targetBytesAmp = 1.5, currentBytesAmp = 1.5;

  function updateSparklines(time) {
    const t = time * 0.003;
    
    targetLogAmp += (1.5 - targetLogAmp) * 0.01;
    targetThreatAmp += (1.5 - targetThreatAmp) * 0.01;
    targetTotalAmp += (1.5 - targetTotalAmp) * 0.01;
    targetBytesAmp += (1.5 - targetBytesAmp) * 0.01;

    currentLogAmp += (targetLogAmp - currentLogAmp) * 0.04;
    currentThreatAmp += (targetThreatAmp - currentThreatAmp) * 0.04;
    currentTotalAmp += (targetTotalAmp - currentTotalAmp) * 0.04;
    currentBytesAmp += (targetBytesAmp - currentBytesAmp) * 0.04;

    function getWavePath(freq, amp, phase) {
      let d = "";
      const steps = 20;
      for (let i = 0; i <= steps; i++) {
        const x = (i / steps) * 100;
        const y = 12.5 + Math.sin((i * freq) + t + phase) * amp + Math.cos((i * freq * 0.5) - t * 0.7) * (amp * 0.4);
        if (i === 0) d += `M${x},${y}`;
        else d += ` L${x},${y}`;
      }
      return d;
    }

    if (sparkPath1) sparkPath1.setAttribute('d', getWavePath(0.45, currentLogAmp, 0));
    if (sparkPath2) sparkPath2.setAttribute('d', getWavePath(0.35, currentThreatAmp, 1.5));
    if (sparkPath3) sparkPath3.setAttribute('d', getWavePath(0.5, currentTotalAmp, 3.0));
    if (sparkPath4) sparkPath4.setAttribute('d', getWavePath(0.4, currentBytesAmp, 4.5));
  }

  function render(time) {
    ctx.clearRect(0, 0, width, height);
    mouse.x += (mouse.targetX - mouse.x) * 0.1;
    mouse.y += (mouse.targetY - mouse.y) * 0.1;
    const t = time * 0.0025;

    updateSparklines(time);

    for (let i = 0; i < dots.length; i++) {
      const d = dots[i];
      const waveX = Math.sin(t + d.baseY * 0.015) * 1.1;
      const waveY = Math.cos(t + d.baseX * 0.015) * 1.1;
      const dx = mouse.x - d.baseX;
      const dy = mouse.y - d.baseY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      let targetX = d.baseX + waveX;
      let targetY = d.baseY + waveY;
      let targetR = d.baseR;
      let targetOpacity = d.colorType !== 'normal' ? d.opacity : 0.28;

      if (dist < hoverRadius) {
        const norm = 1 - dist / hoverRadius;
        const factor = norm * norm * (3 - 2 * norm);
        const addedRadius = factor * 2.8;
        targetR = Math.min(d.baseR + addedRadius, MAX_DOT_RADIUS);
        targetOpacity = Math.min(1, targetOpacity + factor * 0.6);
        const angle = Math.atan2(dy, dx);
        const waveDisplacement = Math.sin(time * 0.008 - dist * 0.07) * 3 * factor;
        const pushAmount = factor * 12;
        targetX = d.baseX - Math.cos(angle) * (pushAmount + waveDisplacement) + waveX;
        targetY = d.baseY - Math.sin(angle) * (pushAmount + waveDisplacement) + waveY;
      }

      d.x += (targetX - d.x) * 0.12;
      d.y += (targetY - d.y) * 0.12;
      d.r += (targetR - d.r) * 0.12;
      d.opacity += (targetOpacity - d.opacity) * 0.12;

      let color;
      if (d.colorType === 'threat') color = `rgba(255, 42, 42, ${d.opacity})`;
      else if (d.colorType === 'suspicious') color = `rgba(255, 179, 0, ${d.opacity})`;
      else color = `rgba(0, 229, 255, ${d.opacity})`;

      const finalRadius = Math.min(Math.max(0.1, d.r), MAX_DOT_RADIUS);

      ctx.beginPath();
      ctx.arc(d.x, d.y, finalRadius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      if (d.colorType === 'threat' || finalRadius > 3.2) {
        ctx.shadowBlur = finalRadius * 2;
        ctx.shadowColor = color;
      } else {
        ctx.shadowBlur = 0;
      }
    }
    requestAnimationFrame(render);
  }

  initGrid();
  requestAnimationFrame(render);

  /* Traffic Flow Animation Engine (Server Center Stream) */
  const tfCanvas = document.getElementById('trafficCanvas');
  const tfCtx = tfCanvas.getContext('2d');
  let tfWidth, tfHeight;
  let particles = [];
  let streams = [];
  const numStreams = 16;

  function resizeTrafficCanvas() {
    tfWidth = tfCanvas.width = tfCanvas.parentElement.clientWidth;
    tfHeight = tfCanvas.height = tfCanvas.parentElement.clientHeight;
    initStreams();
  }

  function initStreams() {
    streams = [];
    const centerX = tfWidth / 2;
    const centerY = tfHeight / 2;

    for (let i = 0; i < numStreams; i++) {
      const offsetX = (i - (numStreams - 1) / 2) * 22;
      const randVal = Math.random();
      let color = '#00e676';
      if (randVal < 0.45) color = '#ff3b3b'; 
      else if (randVal < 0.75) color = '#ffb300'; 
      streams.push({ id: i, bottomX: centerX + offsetX * 1.6, topX: centerX + offsetX * 1.4, color: color });
    }
  }

  function triggerTrafficParticle(isThreat, label) {
    const stream = streams[Math.floor(Math.random() * streams.length)];
    const isIncoming = isThreat; 
    
    let pColor;
    if (isThreat) {
      const isCritical = label.toUpperCase().includes("SQL") || 
                         label.toUpperCase().includes("COMMAND") || 
                         label.toUpperCase().includes("INJECTION");
      pColor = isCritical ? '#ff3b3b' : '#ffb300';
    } else {
      pColor = '#00e676';
    }

    particles.push({
      stream: stream,
      isIncoming: isIncoming,
      progress: 0,
      speed: 0.005 + Math.random() * 0.008,
      size: 2.5 + Math.random() * 2,
      color: pColor,
      name: label || (isThreat ? "Threat" : "Clean")
    });
  }

  function animateTraffic() {
    tfCtx.clearRect(0, 0, tfWidth, tfHeight);
    const centerX = tfWidth / 2;
    const centerY = tfHeight / 2;
    const serverTopY = centerY - 35;
    const serverBottomY = centerY + 35;

    streams.forEach((s) => {
      tfCtx.beginPath();
      tfCtx.moveTo(s.bottomX, tfHeight);
      tfCtx.bezierCurveTo(s.bottomX, tfHeight - 50, centerX + (s.bottomX - centerX) * 0.5, serverBottomY + 30, centerX, serverBottomY);
      tfCtx.strokeStyle = s.color === '#ff3b3b' ? 'rgba(255, 59, 59, 0.12)' : (s.color === '#ffb300' ? 'rgba(255, 179, 0, 0.12)' : 'rgba(0, 230, 118, 0.12)');
      tfCtx.lineWidth = 2;
      tfCtx.stroke();

      tfCtx.beginPath();
      tfCtx.moveTo(centerX, serverTopY);
      tfCtx.bezierCurveTo(centerX, serverTopY - 30, s.topX, 50, s.topX, 0);
      tfCtx.strokeStyle = 'rgba(0, 230, 118, 0.25)';
      tfCtx.lineWidth = 2;
      tfCtx.stroke();
    });

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.progress += p.speed;
      if (p.progress >= 1) { particles.splice(i, 1); continue; }
      let currX, currY;
      if (p.isIncoming) {
        const startX = p.stream.bottomX;
        const startY = tfHeight;
        const endX = centerX;
        const endY = serverBottomY;
        const t = p.progress;
        currX = (1 - t) * (1 - t) * startX + 2 * (1 - t) * t * (centerX + (startX - centerX) * 0.5) + t * t * endX;
        currY = (1 - t) * (1 - t) * startY + 2 * (1 - t) * t * (serverBottomY + 30) + t * t * endY;
      } else {
        const startX = centerX;
        const startY = serverTopY;
        const endX = p.stream.topX;
        const endY = 0;
        const t = p.progress;
        currX = (1 - t) * (1 - t) * startX + 2 * (1 - t) * t * (centerX) + t * t * endX;
        currY = (1 - t) * (1 - t) * startY + 2 * (1 - t) * t * (serverTopY - 30) + t * t * endY;
      }
      tfCtx.beginPath();
      tfCtx.arc(currX, currY, p.size, 0, Math.PI * 2);
      tfCtx.fillStyle = p.color;
      tfCtx.shadowBlur = 10;
      tfCtx.shadowColor = p.color;
      tfCtx.fill();
      tfCtx.shadowBlur = 0;

      if (Math.abs(currY - centerY) > 42) {
        tfCtx.font = "bold 9px -apple-system, sans-serif";
        tfCtx.fillStyle = "rgba(255, 255, 255, 0.75)";
        tfCtx.fillText(p.name, currX + 12, currY + 3);
        tfCtx.beginPath();
        tfCtx.moveTo(currX + p.size + 2, currY);
        tfCtx.lineTo(currX + 10, currY);
        tfCtx.strokeStyle = p.color;
        tfCtx.lineWidth = 1;
        tfCtx.stroke();
      }
    }
    requestAnimationFrame(animateTraffic);
  }

  setTimeout(() => {
    resizeTrafficCanvas();
    animateTraffic();
  }, 100);

  window.addEventListener('resize', () => {
      initGrid();
      resizeTrafficCanvas();
      document.querySelectorAll('.floating-card').forEach(el => {
          el.style.display = 'none';
          el.remove();
      });
      if (typeof occupiedCells !== 'undefined') occupiedCells.clear();
  });


  const threatGrid = document.getElementById('threat-grid');
  const occupiedCells = new Set();

  // Persist dashboard metrics across reloads; reset when the browser session ends.
  const metricStorageKeys = {
      logsSec: 'flarewatch_metric_logs_sec',
      threats: 'flarewatch_metric_threats',
      totalLogs: 'flarewatch_metric_total_logs',
      bytes: 'flarewatch_metric_bytes'
  };

  const storedMetric = (key, fallback = 0) => {
      const value = Number(sessionStorage.getItem(key));
      return Number.isFinite(value) && value >= 0 ? value : fallback;
  };

  let localTotalLogs = storedMetric(metricStorageKeys.totalLogs);
  let localThreats = storedMetric(metricStorageKeys.threats);
  let localBytes = storedMetric(metricStorageKeys.bytes);
  let localLogsPerSecond = storedMetric(metricStorageKeys.logsSec);
  let localEventTimes = [];
  let receivedStats = false;

  // Restore the persisted values immediately on page load.
  document.getElementById("metric-logs-sec").innerText = localLogsPerSecond.toLocaleString();
  document.getElementById("metric-threats").innerText = localThreats.toLocaleString();
  document.getElementById("metric-total-logs").innerText = localTotalLogs.toLocaleString();
  document.getElementById("metric-bytes").innerText =
      `${(localBytes / (1024 * 1024)).toFixed(2)} MB`;

  function handleBackendEvent(data, rawMessage = '') {
      if (!data || typeof data !== 'object') return;

      const now = Date.now();
      localEventTimes.push(now);
      localEventTimes = localEventTimes.filter(t => now - t <= 5000);

      // React to payload byte changes
      if (rawMessage) {
          localBytes += new TextEncoder().encode(rawMessage).length;
          sessionStorage.setItem(metricStorageKeys.bytes, String(localBytes));
          targetBytesAmp = Math.min(10, targetBytesAmp + 1.0); 
      }

      if (data.type === "connection") return;

      if (data.type === "stats") {
          receivedStats = true;

          if (data.logs_per_second !== undefined) {
              localLogsPerSecond = Number(data.logs_per_second) || 0;
              sessionStorage.setItem(metricStorageKeys.logsSec, String(localLogsPerSecond));
              document.getElementById("metric-logs-sec").innerText =
                  localLogsPerSecond.toLocaleString();
          }
          if (data.threats_detected !== undefined) {
              localThreats = Number(data.threats_detected) || 0;
              sessionStorage.setItem(metricStorageKeys.threats, String(localThreats));
              document.getElementById("metric-threats").innerText =
                  localThreats.toLocaleString();
          }
          if (data.logs_processed !== undefined) {
              localTotalLogs = Number(data.logs_processed) || 0;
              sessionStorage.setItem(metricStorageKeys.totalLogs, String(localTotalLogs));
              document.getElementById("metric-total-logs").innerText =
                  localTotalLogs.toLocaleString();
          }
          if (data.bytes_processed !== undefined) {
              localBytes = Number(data.bytes_processed) || 0;
              sessionStorage.setItem(metricStorageKeys.bytes, String(localBytes));
              document.getElementById("metric-bytes").innerText =
                  `${(localBytes / (1024 * 1024)).toFixed(2)} MB`;
          }
          return;
      }

      if (data.type === "log" || data.type === "threat" || data.type === "nothreat") {
          localTotalLogs += 1;
          sessionStorage.setItem(metricStorageKeys.totalLogs, String(localTotalLogs));
          
          targetLogAmp = Math.min(10, targetLogAmp + 0.5);
          targetTotalAmp = Math.min(10, targetTotalAmp + 0.5);

          if (data.type === "threat") {
              localThreats += 1;
              sessionStorage.setItem(metricStorageKeys.threats, String(localThreats));
              targetThreatAmp = Math.min(12, targetThreatAmp + 4.0); 
          }

          if (!receivedStats) {
              document.getElementById("metric-total-logs").innerText =
                  localTotalLogs.toLocaleString();
              document.getElementById("metric-threats").innerText =
                  localThreats.toLocaleString();
              localLogsPerSecond = Math.round(localEventTimes.length / 5);
              sessionStorage.setItem(metricStorageKeys.logsSec, String(localLogsPerSecond));
              document.getElementById("metric-logs-sec").innerText =
                  localLogsPerSecond.toLocaleString();
              sessionStorage.setItem(metricStorageKeys.bytes, String(localBytes));
              document.getElementById("metric-bytes").innerText =
                  `${(localBytes / (1024 * 1024)).toFixed(2)} MB`;
          }

          if (data.type === "threat") {
              const threatTitle = data.threat_name || data.threat || "Unknown Threat";
              triggerTrafficParticle(true, threatTitle);
              spawnLiveThreatCard(data);
          } else {
              triggerTrafficParticle(false, "Clean"); 
          }
      }
  }

  function escapeHtml(value) {
      return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
  }
  
  function removeCard(el) {
      if (el.classList.contains('leaving')) return;
      el.classList.add('leaving');
      el.classList.remove('random-box'); 
      
      if (el.dataset.cell) {
          occupiedCells.delete(el.dataset.cell);
      }
      
      setTimeout(() => {
          if (el.parentNode) el.parentNode.removeChild(el);
      }, 300);
  }

  function spawnLiveThreatCard(data) {
      const el = document.createElement('div');

      const threatName = data.threat_name || data.threat || "Unknown Threat";
      const ip = data.ip || "Unknown IP";
      const req = data.request || "-";

      const isCritical = threatName.toUpperCase().includes("SQL") ||
                         threatName.toUpperCase().includes("COMMAND") ||
                         threatName.toUpperCase().includes("INJECTION");
      const color = isCritical ? 'red' : 'yellow';
      const prio = isCritical ? 'CRITICAL' : 'SUSPICIOUS';

      el.className = `floating-card ${color}`;
      el.innerHTML = `
        <div class="card-top">
          <span class="card-ip">${escapeHtml(ip)}</span>
          <span class="card-priority ${color}">${escapeHtml(prio)}</span>
        </div>
        <div class="card-threat">${escapeHtml(threatName)}</div>
        <div class="card-req">${escapeHtml(req)}</div>
      `;

      const isMobile = window.innerWidth <= 1024;
      let r, c, cellKey;
      let attempts = 0;
      let found = false;

      while (attempts < 50) {
          attempts++;
          if (isMobile) {
              c = Math.floor(Math.random() * 4) + 1;
              r = Math.floor(Math.random() * 6) + 1;
              if ((c === 2 || c === 3) && (r === 3 || r === 4)) continue;
          } else {
              c = Math.floor(Math.random() * 6) + 1;
              r = Math.floor(Math.random() * 5) + 1;
              if ((c === 3 || c === 4) && r === 3) continue;
          }
          
          cellKey = `${c}-${r}`;
          if (!occupiedCells.has(cellKey)) {
              found = true;
              break;
          }
      }

      if (!found) {
           const activeCards = threatGrid.querySelectorAll('.floating-card:not(.leaving)');
           if(activeCards.length > 0) {
               removeCard(activeCards[0]); 
           }
           return; 
      }

      occupiedCells.add(cellKey);
      el.style.gridColumn = c;
      el.style.gridRow = r;
      el.dataset.cell = cellKey;

      threatGrid.appendChild(el);

      setTimeout(() => {
          if (el.parentNode && !el.classList.contains('leaving')) {
             el.classList.add('random-box');
          }
      }, 400); 

      const maxCards = isMobile ? 18 : 26; 
      const activeCards = threatGrid.querySelectorAll('.floating-card:not(.leaving)');
      if (activeCards.length >= maxCards) {
          const excess = activeCards.length - maxCards + 1;
          for(let i=0; i<excess; i++) {
              if(activeCards[i]) removeCard(activeCards[i]);
          }
      }

      setTimeout(() => {
          if (el.parentNode) {
             removeCard(el);
          }
      }, 7000);
  }

  setInterval(() => {
      if (receivedStats) return;
      const now = Date.now();
      localEventTimes = localEventTimes.filter(t => now - t <= 5000);
      localLogsPerSecond = Math.round(localEventTimes.length / 5);
      sessionStorage.setItem(metricStorageKeys.logsSec, String(localLogsPerSecond));
      document.getElementById("metric-logs-sec").innerText =
          localLogsPerSecond.toLocaleString();
  }, 1000);

  const backendWs = new WebSocket('ws://localhost:4005');

  backendWs.onopen = () => {
      console.log('[Frontend] Connected to rustTCP_handler.py WebSocket (4005)');
      const indicator = document.getElementById('status-indicator');
      if (indicator) {
          indicator.innerHTML = '<span class="status-dot"></span> ONLINE';
      }
  };

  backendWs.onmessage = (event) => {
      try {
          const data = JSON.parse(event.data);
          handleBackendEvent(data, event.data);
      } catch (err) {
          console.error('[Frontend] WebSocket JSON parse error:', err);
      }
  };

  backendWs.onerror = (err) => {
      console.error('[Frontend] rustTCP_handler.py WebSocket error:', err);
  };

  backendWs.onclose = () => {
      console.warn('[Frontend] rustTCP_handler.py WebSocket disconnected.');
      const indicator = document.getElementById('status-indicator');
      if (indicator) {
          indicator.innerHTML =

      const isPageNavigation = destination.origin === window.location.origin &&
        destination.pathname !== window.location.pathname &&
        destination.protocol !== 'mailto:';
      if (!isPageNavigation || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
        return;
      }
      event.preventDefault();
      pageContainer.classList.add('page-leaving');
      window.setTimeout(() => { window.location.href = destination.href; }, 280);

  });

  let initialEvents = [];

    const stored = sessionStorage.getItem('flarewatch_live_events');

      liveEvents = JSON.parse(stored);
      // Ensure reloaded events don't trigger the "new" flash animation upon reload
      liveEvents.forEach(e => e.isNew = false);
    }
  } catch (err) {
    console.error('[Live Events] Failed to parse stored events:', err);

  function normalizeText(value) {
    return value == null ? '' : String(value);

    row.innerHTML = `
      <td class="cell-time">${escapeHtml(time)}</td>

<script>
  // Dynamic Uptime Script using sessionStorage
  (function() {
    const uptimeDisplay = document.getElementById('uptime-display');
    
    let startTime = sessionStorage.getItem('flarewatch_session_start');
    if (!startTime) {
      startTime = Date.now();
      sessionStorage.setItem('flarewatch_session_start', startTime);
    } else {
      startTime = parseInt(startTime, 10);
    }

    function updateUptime() {
      const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
      
      const hours = String(Math.floor(elapsedSeconds / 3600)).padStart(2, '0');
      const minutes = String(Math.floor((elapsedSeconds % 3600) / 60)).padStart(2, '0');
      const seconds = String(elapsedSeconds % 60).padStart(2, '0');
      
      if (uptimeDisplay) {
        uptimeDisplay.textContent = `${hours}:${minutes}:${seconds}`;
      }
    }

    updateUptime();
    setInterval(updateUptime, 1000);
  })();

  const pageContainer = document.querySelector('.app-container');

  document.querySelectorAll('a[href]').forEach((link) => {
    link.addEventListener('click', (event) => {
      const destination = new URL(link.href, window.location.href);
      const isPageNavigation = destination.origin === window.location.origin &&
        destination.pathname !== window.location.pathname &&
        destination.protocol !== 'mailto:';

      if (!isPageNavigation || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
        return;
      }

      event.preventDefault();
      pageContainer.classList.add('page-leaving');
      window.setTimeout(() => { window.location.href = destination.href; }, 280);
    });
  });

  const searchBtn = document.querySelector('.btn-search');
  const searchInput = document.querySelector('.search-input');
  const resultsMeta = document.querySelector('.results-meta');
  const resultsMetaSpans = resultsMeta ? resultsMeta.querySelectorAll('span') : [];
  const resultsTableBody = document.querySelector('.logs-table tbody');

  let searchSocket = null;
  let searchSocketPromise = null;

  console.log('[FlareWatch] Search script loaded.', {
    searchButtonFound: !!searchBtn,
    searchInputFound: !!searchInput
  });

  function getSearchSocket() {
    if (searchSocket && searchSocket.readyState === WebSocket.OPEN) {
      return Promise.resolve(searchSocket);
    }

    if (searchSocketPromise) {
      return searchSocketPromise;
    }

    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${wsProtocol}//${window.location.hostname}:4005`;

    console.log('[FlareWatch] Opening WebSocket:', wsUrl);

    searchSocketPromise = new Promise((resolve, reject) => {
      const ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        searchSocket = ws;
        searchSocketPromise = null;
        console.log('[FlareWatch] WebSocket connected to port 4005.');
        resolve(ws);
      };

      ws.onmessage = (event) => {
        try {
          const data = typeof event.data === 'string'
            ? JSON.parse(event.data)
            : event.data;

          if (typeof data !== 'object' || data === null) {
            return;

<script>
  const canvas = document.getElementById('dotCanvas');
  const ctx = canvas.getContext('2d');
  let width, height;
  let dots = [];
  const spacing = 22;
  const baseRadius = 0.7;
  const hoverRadius = 140;
  const MAX_DOT_RADIUS = 4.5;
  let mouse = { x: -1000, y: -1000, targetX: -1000, targetY: -1000 };

  function initGrid() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    dots = [];
    const cols = Math.ceil(width / spacing) + 1;
    const rows = Math.ceil(height / spacing) + 1;
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const baseX = i * spacing;
        const baseY = j * spacing;
        const isThreat = Math.random() < 0.012;
        const isSuspicious = !isThreat && Math.random() < 0.018;
        const initialR = isThreat ? 2.5 : (isSuspicious ? 2.0 : baseRadius);
        dots.push({
          baseX, baseY, x: baseX, y: baseY,
          baseR: initialR, r: initialR,
          colorType: isThreat ? 'threat' : (isSuspicious ? 'suspicious' : 'normal'),
          opacity: isThreat ? 0.85 : (isSuspicious ? 0.75 : 0.28)
        });
      }
    }
  }

  window.addEventListener('resize', initGrid);
  window.addEventListener('mousemove', (e) => {
    mouse.targetX = e.clientX;
    mouse.targetY = e.clientY;
  });
  window.addEventListener('mouseleave', () => {
    mouse.targetX = -1000;
    mouse.targetY = -1000;
  });

  function render(time) {
    ctx.clearRect(0, 0, width, height);
    mouse.x += (mouse.targetX - mouse.x) * 0.1;
    mouse.y += (mouse.targetY - mouse.y) * 0.1;
    const t = time * 0.0025;

    for (let i = 0; i < dots.length; i++) {
      const d = dots[i];
      const waveX = Math.sin(t + d.baseY * 0.015) * 1.1;
      const waveY = Math.cos(t + d.baseX * 0.015) * 1.1;
      const dx = mouse.x - d.baseX;
      const dy = mouse.y - d.baseY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      let targetX = d.baseX + waveX;
      let targetY = d.baseY + waveY;
      let targetR = d.baseR;
      let targetOpacity = d.colorType !== 'normal' ? d.opacity : 0.28;

      if (dist < hoverRadius) {
        const norm = 1 - dist / hoverRadius;
        const factor = norm * norm * (3 - 2 * norm);
        const addedRadius = factor * 2.8;
        targetR = Math.min(d.baseR + addedRadius, MAX_DOT_RADIUS);
        targetOpacity = Math.min(1, targetOpacity + factor * 0.6);
        const angle = Math.atan2(dy, dx);
        const waveDisplacement = Math.sin(time * 0.008 - dist * 0.07) * 3 * factor;
        const pushAmount = factor * 12;
        targetX = d.baseX - Math.cos(angle) * (pushAmount + waveDisplacement) + waveX;
        targetY = d.baseY - Math.sin(angle) * (pushAmount + waveDisplacement) + waveY;
      }

      d.x += (targetX - d.x) * 0.12;
      d.y += (targetY - d.y) * 0.12;
      d.r += (targetR - d.r) * 0.12;
      d.opacity += (targetOpacity - d.opacity) * 0.12;

      let color;
      if (d.colorType === 'threat') color = `rgba(255, 42, 42, ${d.opacity})`;
      else if (d.colorType === 'suspicious') color = `rgba(255, 179, 0, ${d.opacity})`;
      else color = `rgba(0, 229, 255, ${d.opacity})`;

      const finalRadius = Math.min(Math.max(0.1, d.r), MAX_DOT_RADIUS);
      ctx.beginPath();
      ctx.arc(d.x, d.y, finalRadius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      if (d.colorType === 'threat' || finalRadius > 3.2) {
        ctx.shadowBlur = finalRadius * 2;
        ctx.shadowColor = color;
      } else {
        ctx.shadowBlur = 0;
      }
    }
    requestAnimationFrame(render);
  }

  initGrid();
  requestAnimationFrame(render);

  // Search filter functionality implementation
  const searchInput = document.getElementById('ruleSearchInput');
  const rulesTable = document.getElementById('rulesTable');
  const ruleCountLabel = document.getElementById('ruleCountLabel');

  if (searchInput && rulesTable) {
    searchInput.addEventListener('input', function() {
      const filter = searchInput.value.toLowerCase().trim();
      const rows = rulesTable.querySelectorAll('tbody tr');
      let visibleCount = 0;

      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        if (text.includes(filter)) {
          row.style.display = '';
          visibleCount++;
        } else {
          row.style.display = 'none';
        }
      });

      if (ruleCountLabel) {
        ruleCountLabel.textContent = `${visibleCount} configured rules`;
      }
    });
  }
</script>

<script>
  // Live Uptime Counter Simulation
  let seconds = 8072;
  const uptimeEl = document.getElementById('uptimeCounter');
  setInterval(() => {
    seconds++;
    const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
    const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
    const secs = String(seconds % 60).padStart(2, '0');
    uptimeEl.textContent = `${hrs}:${mins}:${secs}`;
  }, 1000);

  // Background Particle Grid Engine
  const canvas = document.getElementById('dotCanvas');
  const ctx = canvas.getContext('2d');

  let width, height;
  let dots = [];
  const spacing = 22;
  const baseRadius = 0.7;
  const hoverRadius = 140;
  const MAX_DOT_RADIUS = 4.5;

  let mouse = { x: -1000, y: -1000, targetX: -1000, targetY: -1000 };

  function initGrid() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    dots = [];
    const cols = Math.ceil(width / spacing) + 1;
    const rows = Math.ceil(height / spacing) + 1;

    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const baseX = i * spacing;
        const baseY = j * spacing;
        
        const isThreat = Math.random() < 0.012;
        const isSuspicious = !isThreat && Math.random() < 0.018;

        const initialR = isThreat ? 2.5 : (isSuspicious ? 2.0 : baseRadius);

        dots.push({
          baseX,
          baseY,
          x: baseX,
          y: baseY,
          baseR: initialR,
          r: initialR,
          colorType: isThreat ? 'threat' : (isSuspicious ? 'suspicious' : 'normal'),
          opacity: isThreat ? 0.85 : (isSuspicious ? 0.75 : 0.28)
        });
      }
    }
  }

  window.addEventListener('resize', initGrid);

  window.addEventListener('mousemove', (e) => {
    mouse.targetX = e.clientX;
    mouse.targetY = e.clientY;
  });

  window.addEventListener('mouseleave', () => {
    mouse.targetX = -1000;
    mouse.targetY = -1000;
  });

  function render(time) {
    ctx.clearRect(0, 0, width, height);

    mouse.x += (mouse.targetX - mouse.x) * 0.1;
    mouse.y += (mouse.targetY - mouse.y) * 0.1;

    const t = time * 0.0025;

    for (let i = 0; i < dots.length; i++) {
      const d = dots[i];

      const waveX = Math.sin(t + d.baseY * 0.015) * 1.1;
      const waveY = Math.cos(t + d.baseX * 0.015) * 1.1;

      const dx = mouse.x - d.baseX;
      const dy = mouse.y - d.baseY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      let targetX = d.baseX + waveX;
      let targetY = d.baseY + waveY;
      let targetR = d.baseR;
      let targetOpacity = d.colorType !== 'normal' ? d.opacity : 0.28;

      if (dist < hoverRadius) {
        const norm = 1 - dist / hoverRadius;
        const factor = norm * norm * (3 - 2 * norm);

        const addedRadius = factor * 2.8;
        targetR = Math.min(d.baseR + addedRadius, MAX_DOT_RADIUS);
        targetOpacity = Math.min(1, targetOpacity + factor * 0.6);

        const angle = Math.atan2(dy, dx);
        const waveDisplacement = Math.sin(time * 0.008 - dist * 0.07) * 3 * factor;
        const pushAmount = factor * 12;

        targetX = d.baseX - Math.cos(angle) * (pushAmount + waveDisplacement) + waveX;
        targetY = d.baseY - Math.sin(angle) * (pushAmount + waveDisplacement) + waveY;
      }

      d.x += (targetX - d.x) * 0.12;
      d.y += (targetY - d.y) * 0.12;
      d.r += (targetR - d.r) * 0.12;
      d.opacity += (targetOpacity - d.opacity) * 0.12;

      let color;
      if (d.colorType === 'threat') {
        color = `rgba(255, 42, 42, ${d.opacity})`;
      } else if (d.colorType === 'suspicious') {
        color = `rgba(255, 179, 0, ${d.opacity})`;
      } else {
        color = `rgba(0, 229, 255, ${d.opacity})`;
      }

      const finalRadius = Math.min(Math.max(0.1, d.r), MAX_DOT_RADIUS);

      ctx.beginPath();
      ctx.arc(d.x, d.y, finalRadius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      if (d.colorType === 'threat' || finalRadius > 3.2) {
        ctx.shadowBlur = finalRadius * 2;
        ctx.shadowColor = color;
      } else {
        ctx.shadowBlur = 0;
      }
    }

    requestAnimationFrame(render);
  }

  initGrid();
  requestAnimationFrame(render);
</script>

<script>
(function () {
  const pages = {
    "overview": "page-overview",
    "live-events": "page-live-events",
    "search-logs": "page-search-logs",
    "rules": "page-rules",
    "about": "page-about"
  };

  let activeNodes = [];
  let activeStyles = [];

  function getPageFromHash() {
    const key = (window.location.hash || "#overview").slice(1);
    return pages[key] ? key : "overview";
  }

  function loadPage(pageKey) {
    const template = document.getElementById(pages[pageKey]);
    if (!template) return;

    activeNodes.forEach((node) => node.remove());
    activeNodes = [];
    activeStyles.forEach((style) => style.remove());
    activeStyles = [];

    const fragment = template.content.cloneNode(true);

    const styleNodes = Array.from(fragment.querySelectorAll("style"));
    styleNodes.forEach((style) => {
      const pageStyle = document.createElement("style");
      pageStyle.setAttribute("data-flarewatch-page-style", pageKey);
      pageStyle.textContent = style.textContent;
      document.head.appendChild(pageStyle);
      activeStyles.push(pageStyle);
      style.remove();
    });

    const titleNode = fragment.querySelector("title");
    if (titleNode) document.title = titleNode.textContent;
    if (titleNode) titleNode.remove();

    const scriptNodes = Array.from(fragment.querySelectorAll("script"));
    scriptNodes.forEach((script) => script.remove());

    while (fragment.firstChild) {
      const node = fragment.firstChild;
      fragment.removeChild(node);
      document.body.appendChild(node);
      activeNodes.push(node);
    }

    scriptNodes.forEach((node) => {
      const script = document.createElement("script");
      for (const attribute of node.attributes) {
        script.setAttribute(attribute.name, attribute.value);
      }
      script.textContent = node.textContent;
      document.body.appendChild(script);
      activeNodes.push(script);
    });
  }

  document.addEventListener("click", function (event) {
    const link = event.target.closest("a[href]");
    if (!link) return;
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

    const href = link.getAttribute("href") || "";
    const match = href.match(/\/frontend\/(overview|live-events|search-logs|rules|about)\.html(?:[?#].*)?$/);
    if (!match) return;

    event.preventDefault();
    event.stopImmediatePropagation();

    const destination = match[1];
    const active = document.querySelector("[data-flarewatch-active-page]") ||
                   document.querySelector("body > .app-container");
    if (active) active.classList.add("page-leaving");

    window.setTimeout(function () {
      window.location.hash = destination;
      window.location.reload();
    }, 280);
  }, true);

  loadPage(getPageFromHash());

  const activeApp = document.querySelector("body > .app-container");
  if (activeApp) activeApp.setAttribute("data-flarewatch-active-page", "");
})();
</script>
