<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlareWatch - Search Logs</title>
<link rel="icon" type="image/x-icon" href="./icon/icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #050507;
    color: #e1e1e6;
    overflow: hidden;
  }

  /* Full Screen Canvas for Interactive Dots */
  #dotCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
  }

  /* App Layout Container */
  .app-container {
    position: relative;
    z-index: 1;
    display: flex;
    width: 100vw;
    height: 100vh;
  }

  /* Animated Collapsible Sidebar */
  .sidebar {
    width: 68px; /* Collapsed width */
    background: rgba(10, 10, 13, 0.9);
    border-right: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(14px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 50px 0;
    flex-shrink: 0;
    overflow: hidden;
    white-space: nowrap;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 10;
    border-radius: 0px 30px 30px 0px;
  }

  .sidebar:hover {
    width: 230px; /* Expanded width */
    box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
  }

  .brand-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px 24px 18px;
    height: 32px;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 1px;
  }

  .brand-logo svg {
    width: 26px;
    height: 30px;
    flex-shrink: 0;
  }

  .brand-logo .red { color: #ff2a2a; }
  .brand-logo .white { color: #ffffff; }

  .brand-text,
  .nav-text,
  .status-text,
  .collapse-btn {
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }

  .sidebar:hover .brand-text,
  .sidebar:hover .nav-text,
  .sidebar:hover .status-text,
  .sidebar:hover .collapse-btn {
    opacity: 1;
    visibility: visible;
    transition-delay: 0.08s;
  }

  .collapse-btn {
    background: transparent;
    border: none;
    color: #666;
    cursor: pointer;
    font-size: 12px;
  }
  .collapse-btn:hover { color: #aaa; }

  .nav-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 0 12px;
  }

  .nav-item a {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px;
    color: #888899;
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    border-radius: 8px;
    height: 44px;
    transition: all 0.2s ease;
  }

  .nav-item a:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.05);
  }

  .nav-item.active a {
    color: #fff;
    background: rgba(255, 42, 42, 0.12);
    border: 1px solid rgba(255, 42, 42, 0.35);
    box-shadow: 0 0 10px rgba(255, 42, 42, 0.18);
  }

  .nav-item svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    flex-shrink: 0;
  }

  .sidebar-footer {
    padding: 0 12px;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: rgba(0, 230, 118, 0.06);
    border: 1px solid rgba(0, 230, 118, 0.2);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    color: #00e676;
    letter-spacing: 0.5px;
    height: 40px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00e676;
    box-shadow: 0 0 8px #00e676;
    flex-shrink: 0;
  }

  /* Main Viewport */
  .main-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top Bar */
  .topbar {
    height: 60px;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 28px;
    width: 100%;
  }

  .header-container {
    display: flex;
    height: 60px;
    border: 1px solid rgba(255, 255, 255, 0.097);
    backdrop-filter: blur(2px);
    background-color: rgba(255, 255, 255, 0.071);
    border-radius: 30px;
    align-items: center;
    justify-content: center;
    width: 30%;
  }

  .topbar-info {
    display: flex;
    align-items: center;
    gap: 36px;
  }

  .info-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .info-label {
    font-size: 10px;
    color: #666677;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .info-value {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .info-value.online {
    color: #00e676;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .icon-btn {
    background: transparent;
    border: none;
    color: #888899;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-btn:hover { color: #fff; }

  .badge {
    position: absolute;
    top: -4px;
    right: -6px;
    background: #ff2a2a;
    color: #fff;
    font-size: 9px;
    font-weight: 800;
    padding: 1px 4px;
    border-radius: 8px;
  }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aaa;
    cursor: pointer;
  }

  /* Content Dashboard Area */
  .content-area {
    flex: 1;
    padding: 24px 28px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
    
    /* Hide scrollbars */
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  
  .content-area::-webkit-scrollbar {
    display: none;
  }

  /* Header Title & Breadcrumb */
  .page-header {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .page-title {
    font-size: 20px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 0.5px;
  }

  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #666677;
    font-weight: 600;
  }

  .breadcrumb svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
  }

  /* Search Bar Section */
  .search-section {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  .search-input-wrapper {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-icon {
    position: absolute;
    left: 14px;
    width: 16px;
    height: 16px;
    stroke: #888899;
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    height: 42px;
    background: rgba(14, 14, 18, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 0 16px 0 42px;
    color: #ffffff;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    backdrop-filter: blur(8px);
  }

  .search-input:focus {
    border-color: rgba(255, 42, 42, 0.6);
    box-shadow: 0 0 10px rgba(255, 42, 42, 0.2);
  }

  .btn-search {
    height: 42px;
    padding: 0 28px;
    background: #ff2a2a;
    border: none;
    border-radius: 8px;
    color: #ffffff;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(255, 42, 42, 0.35);
    transition: background 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-search:hover {
    background: #e02222;
  }

  .btn-export {
    height: 42px;
    padding: 0 20px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    color: #cccccc;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    backdrop-filter: blur(8px);
    transition: background 0.2s, color 0.2s;
  }

  .btn-export:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #ffffff;
  }

  .btn-export svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
  }

  /* Search Info Meta */
  .results-meta {
    font-size: 12.5px;
    color: #888899;
    font-weight: 500;
  }

  .results-meta span {
    color: #e1e1e6;
  }

  /* Logs Panel Card */
  .logs-card {
    display: flex;
    flex-direction: column;
    overflow-y: auto; /* Added smooth scrolling within card */
    flex: 1;
    justify-content: flex-start; /* Removed space-between to accommodate removed pagination */
    border: 1px solid rgba(255, 255, 255, 0.097);
    backdrop-filter: blur(2px);
    background-color: rgba(255, 255, 255, 0.071);
    border-radius: 30px;
    
    /* Hide scrollbars */
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  .logs-card::-webkit-scrollbar {
    display: none;
  }

  /* Table styling */
  .logs-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  .logs-table th {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.8px;
    color: #888899;
    text-transform: uppercase;
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
   background: rgb(20, 20, 20); /* Slightly darkened for better sticky contrast */
    position: sticky; /* Made header sticky */
    top: 0;
    z-index: 10;
    backdrop-filter: blur(10px);
  }

  .logs-table td {
    padding: 12px 20px;
    font-size: 13px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    font-family: monospace;
    color: #bbbbcc;
    white-space: nowrap;
  }

  .logs-table tr:hover {
    background: rgba(255, 255, 255, 0.02);
  }

  /* Log Row Animations */
  @keyframes tile-enter {
    from {
      opacity: 0;
      transform: translateY(16px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .logs-table tbody tr {
    opacity: 0;
    animation: tile-enter 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  /* Stagger the animations for a smooth waterfall effect */
  .logs-table tbody tr:nth-child(1) { animation-delay: 0.05s; }
  .logs-table tbody tr:nth-child(2) { animation-delay: 0.10s; }
  .logs-table tbody tr:nth-child(3) { animation-delay: 0.15s; }
  .logs-table tbody tr:nth-child(4) { animation-delay: 0.20s; }
  .logs-table tbody tr:nth-child(5) { animation-delay: 0.25s; }
  .logs-table tbody tr:nth-child(6) { animation-delay: 0.30s; }
  .logs-table tbody tr:nth-child(7) { animation-delay: 0.35s; }
  .logs-table tbody tr:nth-child(8) { animation-delay: 0.40s; }
  .logs-table tbody tr:nth-child(9) { animation-delay: 0.45s; }
  .logs-table tbody tr:nth-child(10) { animation-delay: 0.50s; }
  .logs-table tbody tr:nth-child(n+11) { animation-delay: 0.55s; }

  .col-id {
    width: 90px;
  }

  .col-time {
    width: 220px;
  }

  .badge-error {
    color: #ff3b3b;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-right: 12px;
  }

  @media (max-width: 768px) {
    .search-section { flex-wrap: wrap; }
    .btn-search { flex: 1; }
    .btn-export { width: 100%; justify-content: center; }
  }

  .app-container {
    animation: page-enter 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    transform-origin: center top;
  }

  .app-container.page-leaving {
    animation: page-leave 0.28s cubic-bezier(0.4, 0, 1, 1) both;
    pointer-events: none;
  }

  @keyframes page-enter {
    from { opacity: 0; transform: translateY(12px) scale(0.99); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes page-leave {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to { opacity: 0; transform: translateY(-8px) scale(0.995); }
  }

  @media (prefers-reduced-motion: reduce) {
    .app-container,
    .app-container.page-leaving,
    .logs-table tbody tr { animation: none; opacity: 1; transform: none; }
  }
</style>

<script>
  // Dynamic Uptime Script using sessionStorage
  (function() {
    const uptimeDisplay = document.getElementById('uptime-display');
    
    let startTime = sessionStorage.getItem('flarewatch_session_start');
    if (!startTime) {
      startTime = Date.now();
      sessionStorage.setItem('flarewatch_session_start', startTime);
    } else {
      startTime = parseInt(startTime, 10);
    }

    function updateUptime() {
      const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
      
      const hours = String(Math.floor(elapsedSeconds / 3600)).padStart(2, '0');
      const minutes = String(Math.floor((elapsedSeconds % 3600) / 60)).padStart(2, '0');
      const seconds = String(elapsedSeconds % 60).padStart(2, '0');
      
      if (uptimeDisplay) {
        uptimeDisplay.textContent = `${hours}:${minutes}:${seconds}`;
      }
    }

    updateUptime();
    setInterval(updateUptime, 1000);
  })();

  const pageContainer = document.querySelector('.app-container');

  document.querySelectorAll('a[href]').forEach((link) => {
    link.addEventListener('click', (event) => {
      const destination = new URL(link.href, window.location.href);
      const isPageNavigation = destination.origin === window.location.origin &&
        destination.pathname !== window.location.pathname &&
        destination.protocol !== 'mailto:';

      if (!isPageNavigation || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
        return;
      }

      event.preventDefault();
      pageContainer.classList.add('page-leaving');
      window.setTimeout(() => { window.location.href = destination.href; }, 280);
    });
  });

  const searchBtn = document.querySelector('.btn-search');
  const searchInput = document.querySelector('.search-input');
  const resultsMeta = document.querySelector('.results-meta');
  const resultsMetaSpans = resultsMeta ? resultsMeta.querySelectorAll('span') : [];
  const resultsTableBody = document.querySelector('.logs-table tbody');

  let searchSocket = null;
  let searchSocketPromise = null;

  console.log('[FlareWatch] Search script loaded.', {
    searchButtonFound: !!searchBtn,
    searchInputFound: !!searchInput
  });

  function getSearchSocket() {
    if (searchSocket && searchSocket.readyState === WebSocket.OPEN) {
      return Promise.resolve(searchSocket);
    }

    if (searchSocketPromise) {
      return searchSocketPromise;
    }

    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${wsProtocol}//${window.location.hostname}:4003`;

    console.log('[FlareWatch] Opening WebSocket:', wsUrl);

    searchSocketPromise = new Promise((resolve, reject) => {
      const ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        searchSocket = ws;
        searchSocketPromise = null;
        console.log('[FlareWatch] WebSocket connected to port 4003.');
        resolve(ws);
      };

      ws.onmessage = (event) => {
        try {
          const data = typeof event.data === 'string'
            ? JSON.parse(event.data)
            : event.data;

          if (typeof data !== 'object' || data === null) {
            return;
          }

          if (data.type === 'connection') {
            console.log('[FlareWatch] Port 4003 connection confirmed.');
            return;
          }

          if (data.type === 'search_response') {
            if (data.error) {
              console.error('[FlareWatch] Search error:', data.error);
              if (searchBtn) {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
              }
              return;
            }

            updateSearchResults(data.query || '', data.results || []);
            if (searchBtn) {
              searchBtn.disabled = false;
              searchBtn.textContent = 'Search';
            }
            console.log('[FlareWatch] Search response received:', {
              query: data.query || '',
              count: data.count || 0
            });
          }
        } catch (error) {
          console.error('[FlareWatch] Invalid response from port 4003:', error);
        }
      };

      ws.onclose = (event) => {
        if (searchSocket === ws) {
          searchSocket = null;
        }

        searchSocketPromise = null;

        console.log('[FlareWatch] WebSocket closed.', {
          code: event.code,
          reason: event.reason,
          wasClean: event.wasClean
        });
      };

      ws.onerror = (error) => {
        searchSocketPromise = null;
        console.error('[FlareWatch] WebSocket error on port 4003:', error);
        reject(error);
      };
    });

    return searchSocketPromise;
  }

  function updateSearchResults(query, results) {
    sessionStorage.setItem('flarewatch_search_state', JSON.stringify({ query, results }));

    if (resultsMetaSpans.length >= 2) {
      resultsMetaSpans[0].textContent = String(results.length);
      resultsMetaSpans[1].textContent = query;
    }

    if (!resultsTableBody) {
      return;
    }

    resultsTableBody.innerHTML = '';

    if (results.length === 0) {
      const row = document.createElement('tr');
      const cell = document.createElement('td');
      cell.colSpan = 3;
      cell.textContent = `No results found for "${query}"`;
      cell.style.textAlign = 'center';
      cell.style.color = '#888899';
      row.appendChild(cell);
      resultsTableBody.appendChild(row);
      return;
    }

    results.forEach((result, index) => {
      const row = document.createElement('tr');

      const idCell = document.createElement('td');
      idCell.className = 'col-id';
      idCell.textContent = String(index + 1);

      const timeCell = document.createElement('td');
      timeCell.className = 'col-time';

      const rawTimestamp = result.timestamp;
      let date = null;

      if (rawTimestamp !== null && rawTimestamp !== undefined) {
        // Strip extra literal quotes if present in string format
        const cleanedStr = String(rawTimestamp).replace(/^"|"$/g, '').trim();
        const numVal = Number(cleanedStr);

        if (!isNaN(numVal) && cleanedStr !== '') {
          // If 10-digit epoch timestamp (seconds), multiply by 1000 to convert to ms
          date = new Date(numVal < 1e11 ? numVal * 1000 : numVal);
        } else {
          date = new Date(cleanedStr);
        }
      }

      if (date && !isNaN(date.getTime())) {
        timeCell.textContent = date.toISOString().replace('T', ' ').replace(/\.\d+Z$/, '').replace('Z', '');
      } else {
        timeCell.textContent = String(rawTimestamp ?? '');
      }

      const entryCell = document.createElement('td');

      if (result.threat && String(result.threat).toUpperCase() !== 'NOTHREAT') {
        const badge = document.createElement('span');
        badge.className = 'badge-error';
        badge.textContent = String(result.threat);
        entryCell.appendChild(badge);
        entryCell.appendChild(document.createTextNode(' '));
      }

      entryCell.appendChild(
        document.createTextNode(String(result.request ?? ''))
      );

      row.appendChild(idCell);
      row.appendChild(timeCell);
      row.appendChild(entryCell);
      resultsTableBody.appendChild(row);
    });
  }

  function sendSearchRequest(query) {
    query = String(query || '').trim();
    console.log('[FlareWatch] Search button triggered.', { query });

    if (!query) {
      console.log('[FlareWatch] Empty search query; request not sent.');
      return;
    }

    if (searchBtn) {
      searchBtn.disabled = true;
      searchBtn.textContent = 'Searching...';
    }

    // Convert string to bytes to calculate exact payload sizes just in case,
    // though the Python script handles this automatically on its end.
    const queryLength = new TextEncoder().encode(query).length;

    // Construct the exact JSON payload the Python backend expects
    const payload = {
      totalFrameBytes: 7 + queryLength, 
      type: 5,                           
      requestLength: queryLength,
      request: query
    };

    console.log('[FlareWatch] Search frame:', payload);

    getSearchSocket()
      .then((ws) => {
        if (ws.readyState !== WebSocket.OPEN) {
          console.error('[FlareWatch] WebSocket to port 4003 is not open.');
          return;
        }

        // Send as a JSON string so Python reads it as a text frame (opcode 0x1)
        ws.send(JSON.stringify(payload));
        console.log('[FlareWatch] Search request sent.');
      })
      .catch((error) => {
        console.error('[FlareWatch] Could not connect to port 4003:', error);
        if (searchBtn) {
          searchBtn.disabled = false;
          searchBtn.textContent = 'Search';
        }
      });
  }

  if (searchBtn && searchInput && !searchBtn.dataset.searchHandlerAttached) {
    searchBtn.dataset.searchHandlerAttached = 'true';

    searchBtn.addEventListener('click', () => {
      sendSearchRequest(searchInput.value);
    });

    searchInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        sendSearchRequest(searchInput.value);
      }
    });
  } else if (!searchBtn || !searchInput) {
    console.error('[FlareWatch] Search button or input was not found.');
  }

  // Establish the single browser -> Python WebSocket connection once.
  getSearchSocket().catch(() => {});

  // Full Screen Interactive Canvas Grid Engine
  const canvas = document.getElementById('dotCanvas');
  const ctx = canvas.getContext('2d');

  let width, height;
  let dots = [];
  const spacing = 22;             
  const baseRadius = 0.7;        
  const hoverRadius = 140;        
  const MAX_DOT_RADIUS = 4.5;     

  let mouse = { x: -1000, y: -1000, targetX: -1000, targetY: -1000 };

  function initGrid() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    dots = [];
    const cols = Math.ceil(width / spacing) + 1;
    const rows = Math.ceil(height / spacing) + 1;

    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const baseX = i * spacing;
        const baseY = j * spacing;
        
        const isThreat = Math.random() < 0.012;
        const isSuspicious = !isThreat && Math.random() < 0.018;

        const initialR = isThreat ? 2.5 : (isSuspicious ? 2.0 : baseRadius);

        dots.push({
          baseX,
          baseY,
          x: baseX,
          y: baseY,
          baseR: initialR,
          r: initialR,
          colorType: isThreat ? 'threat' : (isSuspicious ? 'suspicious' : 'normal'),
          opacity: isThreat ? 0.85 : (isSuspicious ? 0.75 : 0.28)
        });
      }
    }
  }

  window.addEventListener('resize', initGrid);

  window.addEventListener('mousemove', (e) => {
    mouse.targetX = e.clientX;
    mouse.targetY = e.clientY;
  });

  window.addEventListener('mouseleave', () => {
    mouse.targetX = -1000;
    mouse.targetY = -1000;
  });

  function render(time) {
    ctx.clearRect(0, 0, width, height);

    mouse.x += (mouse.targetX - mouse.x) * 0.1;
    mouse.y += (mouse.targetY - mouse.y) * 0.1;

    const t = time * 0.0025;

    for (let i = 0; i < dots.length; i++) {
      const d = dots[i];

      const waveX = Math.sin(t + d.baseY * 0.015) * 1.1;
      const waveY = Math.cos(t + d.baseX * 0.015) * 1.1;

      const dx = mouse.x - d.baseX;
      const dy = mouse.y - d.baseY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      let targetX = d.baseX + waveX;
      let targetY = d.baseY + waveY;
      let targetR = d.baseR;
      let targetOpacity = d.colorType !== 'normal' ? d.opacity : 0.28;

      if (dist < hoverRadius) {
        const norm = 1 - dist / hoverRadius;
        const factor = norm * norm * (3 - 2 * norm);

        const addedRadius = factor * 2.8;
        targetR = Math.min(d.baseR + addedRadius, MAX_DOT_RADIUS);
        targetOpacity = Math.min(1, targetOpacity + factor * 0.6);

        const angle = Math.atan2(dy, dx);
        const waveDisplacement = Math.sin(time * 0.008 - dist * 0.07) * 3 * factor;
        const pushAmount = factor * 12;

        targetX = d.baseX - Math.cos(angle) * (pushAmount + waveDisplacement) + waveX;
        targetY = d.baseY - Math.sin(angle) * (pushAmount + waveDisplacement) + waveY;
      }

      d.x += (targetX - d.x) * 0.12;
      d.y += (targetY - d.y) * 0.12;
      d.r += (targetR - d.r) * 0.12;
      d.opacity += (targetOpacity - d.opacity) * 0.12;

      let color;
      if (d.colorType === 'threat') {
        color = `rgba(255, 42, 42, ${d.opacity})`;
      } else if (d.colorType === 'suspicious') {
        color = `rgba(255, 179, 0, ${d.opacity})`;
      } else {
        color = `rgba(0, 229, 255, ${d.opacity})`;
      }

      const finalRadius = Math.min(Math.max(0.1, d.r), MAX_DOT_RADIUS);

      ctx.beginPath();
      ctx.arc(d.x, d.y, finalRadius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      if (d.colorType === 'threat' || finalRadius > 3.2) {
        ctx.shadowBlur = finalRadius * 2;
        ctx.shadowColor = color;
      } else {
        ctx.shadowBlur = 0;
      }
    }

    requestAnimationFrame(render);
  }

  initGrid();
  requestAnimationFrame(render);

  window.addEventListener('DOMContentLoaded', () => {
    const savedState = sessionStorage.getItem('flarewatch_search_state');
    if (savedState) {
      try {
        const { query, results } = JSON.parse(savedState);
        if (searchInput) searchInput.value = query;
        updateSearchResults(query, results);
      } catch (e) {
        console.error('[FlareWatch] Failed to restore search state:', e);
      }
    }
  });
</script>

</body>
</html>
